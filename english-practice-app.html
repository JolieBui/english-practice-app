<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluency Forge — Daily B1→C1 English Practice</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Fallback CSS variables for standalone browser use */
    :root {
      --background: #ffffff;
      --foreground: #111827;
      --card: #f9fafb;
      --card-foreground: #111827;
      --border: #e5e7eb;
      --muted-foreground: #6b7280;
      --primary: #111827;
      --primary-foreground: #ffffff;
      --secondary: #f3f4f6;
      --secondary-foreground: #111827;
      --accent: #FFE500;
      --placeholder: #9ca3af;
    }

    /* Font and base canvas */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
    }

    /* Highlighter styles - marker stroke effect */
    .hl-yellow { background: linear-gradient(180deg, transparent 55%, #FFE500 55%); padding: 0 4px; border-radius: 2px; }
    .hl-pink { background: linear-gradient(180deg, transparent 55%, #FFB3C6 55%); padding: 0 4px; border-radius: 2px; }
    .hl-purple { background: linear-gradient(180deg, transparent 55%, #C9B8FF 55%); padding: 0 4px; border-radius: 2px; }
    .hl-blue { background: linear-gradient(180deg, transparent 55%, #A8D8FF 55%); padding: 0 4px; border-radius: 2px; }
    .hl-green { background: linear-gradient(180deg, transparent 55%, #39FF14 55%); padding: 0 4px; border-radius: 2px; }

    /* Neo-Brutalist & Modern Study Aesthetic */
    .card-study {
      background-color: var(--card);
      border: 2px solid #111827;
      border-radius: 14px;
      box-shadow: 3.5px 3.5px 0px #111827;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-study-sm {
      background-color: var(--card);
      border: 1.5px solid #111827;
      border-radius: 10px;
      box-shadow: 2px 2px 0px #111827;
    }
    .card-study:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4.5px 4.5px 0px #111827;
    }

    /* Buttons */
    .btn-dark {
      background-color: #111827;
      color: #ffffff;
      border: 2px solid #111827;
      border-radius: 10px;
      font-weight: 600;
      padding: 10px 20px;
      box-shadow: 2.5px 2.5px 0px #111827;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .btn-dark:hover {
      background-color: #1f2937;
      transform: translate(-1px, -1px);
      box-shadow: 3.5px 3.5px 0px #111827;
    }
    .btn-dark:active {
      transform: translate(1.5px, 1.5px);
      box-shadow: 1px 1px 0px #111827;
    }

    .btn-secondary {
      background-color: var(--card);
      color: #111827;
      border: 2px solid #111827;
      border-radius: 10px;
      font-weight: 600;
      padding: 9px 18px;
      box-shadow: 2px 2px 0px #111827;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background-color: #FFE500;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #111827;
    }
    .btn-secondary:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #111827;
    }

    .btn-pastel-pink {
      background-color: #FFB3C6;
      color: #111827;
      border: 2px solid #111827;
      border-radius: 10px;
      font-weight: 600;
      padding: 9px 18px;
      box-shadow: 2px 2px 0px #111827;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-pastel-pink:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #111827;
    }

    .btn-pastel-purple {
      background-color: #C9B8FF;
      color: #111827;
      border: 2px solid #111827;
      border-radius: 10px;
      font-weight: 600;
      padding: 9px 18px;
      box-shadow: 2px 2px 0px #111827;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-pastel-purple:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #111827;
    }

    .btn-pastel-blue {
      background-color: #A8D8FF;
      color: #111827;
      border: 2px solid #111827;
      border-radius: 10px;
      font-weight: 600;
      padding: 9px 18px;
      box-shadow: 2px 2px 0px #111827;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-pastel-blue:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #111827;
    }

    /* Badges */
    .badge-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1.5px solid #111827;
    }

    /* 3D Flashcard */
    .flashcard-scene {
      perspective: 1200px;
      width: 100%;
      min-height: 300px;
    }
    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .flashcard.is-flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      position: absolute;
      width: 100%;
      min-height: 300px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 16px;
      border: 2.5px solid #111827;
      box-shadow: 4px 4px 0px #111827;
      background-color: var(--card);
      padding: 24px;
    }
    .flashcard-back {
      transform: rotateY(180deg);
      background-color: var(--card);
    }

    /* Circular Timer Progress */
    .timer-ring-circle {
      transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Flame Pulse Animation */
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) rotate(4deg); }
    }
    .flame-animated {
      display: inline-block;
      animation: flamePulse 2s infinite ease-in-out;
    }

    /* Heatmap Grid */
    .heatmap-cell {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid #111827;
      transition: transform 0.15s ease;
      cursor: pointer;
    }
    .heatmap-cell:hover {
      transform: scale(1.35);
      z-index: 10;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Print Styles for Paper Mode */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .no-print, header, nav, #dock-nav, button:not(.print-keep), .btn-dark, .btn-secondary, #timer-controls-bar {
        display: none !important;
      }
      .paper-worksheet {
        border: 2px solid #000000 !important;
        box-shadow: none !important;
        padding: 24px !important;
        margin: 0 !important;
        page-break-inside: avoid;
        background: #ffffff !important;
        color: #000000 !important;
      }
    }
  </style>
</head>

  <script>
    // --- CURATED DATASETS ---
    const TECHNIQUES = [{"id": 1, "title": "Say It Without Saying It", "subtitle": "Circumlocution & Taboo Speaking", "duration": "10-15 min", "time": 60, "tag": "Speaking", "tagColor": "#FFE500", "icon": "<svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z\"/></svg>", "description": "Explain an advanced B1-C1 word for 60 seconds without saying the word itself. Build mental agility and circumlocution skills.", "paperTip": "Write the target word at the top of your page. In 30 seconds, write 3 bullet points: category, opposite, and a real-life situation. Speak aloud for 60s looking at your notes."}, {"id": 2, "title": "Describe a Picture in 60s", "subtitle": "Visual Scene & Sensory Fluency", "duration": "10-15 min", "time": 60, "tag": "Visual", "tagColor": "#FFB3C6", "icon": "<svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z\"/></svg>", "description": "Get a vivid text scene prompt (or upload a photo). Speak for 60 seconds describing what you see, spatial details, and atmosphere.", "paperTip": "Sketch a quick 30-second doodle or diagram of the scene on paper. Mark 3 focal zones (foreground, background, mood). Speak non-stop for 60s."}, {"id": 3, "title": "Three Random Words, One Story", "subtitle": "Impromptu Narrative Synthesis", "duration": "15 min", "time": 180, "tag": "Creative", "tagColor": "#C9B8FF", "icon": "<svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z\"/></svg>", "description": "Receive 3 disparate words (nouns, verbs, adjectives). Weave them into a coherent 3-minute spoken or written narrative.", "paperTip": "Draw 3 circles in your notebook with the words inside. Draw connecting arrows numbered 1, 2, 3 showing story progression. Narrate your tale."}, {"id": 4, "title": "Collocations & Sentence Frames", "subtitle": "Phrasal Precision & Chunking", "duration": "10-15 min", "time": 120, "tag": "Vocabulary", "tagColor": "#A8D8FF", "icon": "<svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10\"/></svg>", "description": "Master native phrase structures. Study 5 rotating B1-C1 collocation frames and produce 3 original sentences for each.", "paperTip": "Divide your page into 2 columns: 'The Frame' on left, '3 Real-Life Sentences' on right. Highlight prepositions with your marker."}, {"id": 5, "title": "Cover & Recall", "subtitle": "Che L\u1ea1i v\u00e0 T\u1ef1 N\u00f3i \u2014 Working Memory", "duration": "15 min", "time": 30, "tag": "Memory", "tagColor": "#FFE500", "icon": "<svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21\"/></svg>", "description": "Read an authentic passage for 30s. Cover it completely. Reconstruct the ideas out loud or in writing, then check key chunks.", "paperTip": "Read the passage on screen. Close your laptop or turn the screen over. Write down bullet points from memory in your notebook, then compare."}, {"id": 6, "title": "Retrieval Practice (SRS)", "subtitle": "Th\u1ef1c H\u00e0nh Truy H\u1ed3i \u2014 Spaced Repetition", "duration": "10-15 min", "time": 0, "tag": "SRS Deck", "tagColor": "#39FF14", "icon": "<svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15\"/></svg>", "description": "40 B1-C1 flashcards powered by the SM-2 spaced repetition algorithm. Active recall strengthens long-term memory pathways.", "paperTip": "Use physical index cards or write 5 cards in your notebook. Front: Target word + CEFR level. Back: Meaning + 1 strong collocation."}, {"id": 7, "title": "Story Retelling \u2014 4-3-2", "subtitle": "Speaking Rate & Pacing Fluency", "duration": "15-20 min", "time": 240, "tag": "Fluency", "tagColor": "#FFB3C6", "icon": "<svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z\"/></svg>", "description": "Retell the same story 3 times: 4 minutes (elaborate), 3 minutes (concise), 2 minutes (fluent). Proven second-language fluency booster.", "paperTip": "Fold a sheet into 3 columns: '4 min (Keywords)', '3 min (Cuts)', '2 min (Polish)'. Retell aloud using your kitchen timer or phone."}];

    const PASSAGES_DATA = [{"id": 1, "title": "Urban Green Corridors & Micro-Climates", "genre": "News Report", "level": "B2", "text": "Urban centers worldwide are accelerating investments in micro-forests and green corridors to mitigate heat island effects. Recent meteorological data indicates that planting native trees along pedestrian avenues can reduce ambient surface temperatures by up to four degrees Celsius. Moreover, these green buffer zones absorb substantial urban runoff during severe downpours, diminishing the frequency of flash floods. City planners argue that prioritizing biodiversity is no longer merely aesthetic, but rather an indispensable component of resilient municipal infrastructure in an unpredictable climate.", "keyChunks": ["accelerating investments", "mitigate heat island effects", "meteorological data indicates", "ambient surface temperatures", "green buffer zones", "diminishing the frequency", "indispensable component", "resilient municipal infrastructure"]}, {"id": 2, "title": "Sprint Velocity & Roadmap Prioritization", "genre": "Workplace Dialogue", "level": "B2", "text": "Liam: 'Have you had a chance to review the updated sprint velocity? If we persist with the initial roadmap, we run a considerable risk of burnout before launch.'\nMaya: 'I share your apprehension. However, scaling back the core deliverables might jeopardize our stakeholder consensus. What if we defer the analytics module to phase two?'\nLiam: 'That strikes a reasonable compromise. It affords the front-end engineers sufficient breathing room to stabilize the authentication flow without sacrificing our launch date.'", "keyChunks": ["updated sprint velocity", "persist with the initial roadmap", "run a considerable risk of", "share your apprehension", "jeopardize our stakeholder consensus", "defer the analytics module", "strikes a reasonable compromise", "sufficient breathing room"]}, {"id": 3, "title": "The Psychology of Remote Work & Solitude", "genre": "Opinion Editorial", "level": "B2-C1", "text": "While asynchronous remote work undeniably liberated employees from the drudgery of lengthy commutes, it subtly introduced a more pernicious challenge: cognitive isolation. Without spontaneous watercooler exchanges, interdepartmental empathy gradually erodes, replaced by transactional message threads. True workplace innovation rarely thrives in an echo chamber of scheduled calendar invites; it demands unexpected friction, serendipitous debates, and shared laughter. Organizations that fail to intentionally cultivate spontaneous informal spaces will find their operational efficiency intact, but their creative spark fundamentally extinguished.", "keyChunks": ["drudgery of lengthy commutes", "pernicious challenge", "cognitive isolation", "spontaneous watercooler exchanges", "interdepartmental empathy", "transactional message threads", "echo chamber", "serendipitous debates", "cultivate spontaneous informal spaces", "creative spark fundamentally extinguished"]}, {"id": 4, "title": "Neural Networks in Medical Imaging", "genre": "Science & Tech", "level": "B2", "text": "Machine learning algorithms are transforming diagnostic radiology by identifying subtle microcalcifications long before they become palpable to clinical oncologists. Rather than replacing medical practitioners, these neural networks serve as tireless second readers, flagging anomalous tissue scans with remarkable fidelity. Extensive clinical trials demonstrate that diagnostic accuracy surges when human intuition collaborates symbiotically with automated pattern recognition. The principal impediment moving forward is not technological efficacy, but rather establishing ethical transparency regarding how algorithmic recommendations are formulated.", "keyChunks": ["diagnostic radiology", "palpable to clinical oncologists", "tireless second readers", "remarkable fidelity", "extensive clinical trials", "diagnostic accuracy surges", "collaborates symbiotically", "automated pattern recognition", "principal impediment", "ethical transparency"]}, {"id": 5, "title": "Balancing Departmental Budgets", "genre": "Business Dialogue", "level": "B2", "text": "Elena: 'The board has mandated an across-the-board ten percent expenditure reduction across all operational departments before the fourth quarter.'\nMarcus: 'Executing a uniform cut is counterproductive. Our customer retention team is operating at full capacity; trimming their headcount will inevitably erode client loyalty.'\nElena: 'What alternative do you propose? We must present a balanced sheet by Friday morning.'\nMarcus: 'Let us consolidate our redundant software subscriptions first. We can eliminate duplicate cloud tooling before touching personnel.'", "keyChunks": ["across-the-board", "expenditure reduction", "counterproductive", "operating at full capacity", "inevitably erode client loyalty", "consolidate our redundant software", "eliminate duplicate cloud tooling", "touching personnel"]}, {"id": 6, "title": "The Power of Incremental Micro-Habits", "genre": "Self-Improvement Essay", "level": "B1-B2", "text": "Most people mistakenly assume that monumental transformations necessitate radical upheavals in daily routine. In reality, behavioral psychology demonstrates that tiny, incremental micro-habits yield far more sustainable outcomes. Dedicating just ten focused minutes each morning to language immersion or journaling leverages the compound effect over months. Because micro-habits demand minimal initial willpower, they easily bypass our innate resistance to change. Consistency, rather than sporadic intensity, remains the undisputed catalyst for enduring personal mastery.", "keyChunks": ["monumental transformations", "radical upheavals", "behavioral psychology demonstrates", "incremental micro-habits", "sustainable outcomes", "compound effect", "minimal initial willpower", "innate resistance to change", "sporadic intensity", "undisputed catalyst"]}, {"id": 7, "title": "Biometric Surveillance in Public Squares", "genre": "Academic Reflection", "level": "C1", "text": "The proliferation of biometric surveillance in public squares poses an unsettling dilemma for democratic governance. Proponents justify ubiquitous facial recognition under the banner of civic security and proactive crime prevention. Yet this utilitarian rationale discounts the profound psychological toll of perpetual observation. When citizens internalize the notion that every glance and gesture is monitored and logged, spontaneous civic assembly and nonconformist expression inevitably wither. Security purchased at the expense of authentic civil liberty is a pyrrhic victory.", "keyChunks": ["proliferation of biometric surveillance", "unsettling dilemma", "democratic governance", "ubiquitous facial recognition", "utilitarian rationale", "perpetual observation", "spontaneous civic assembly", "nonconformist expression", "civil liberty", "pyrrhic victory"]}, {"id": 8, "title": "Emergency Symposium Keynote Replacement", "genre": "Coordination Dialogue", "level": "B2", "text": "Sophia: 'The keynote speaker for the European symposium just cancelled due to an unforeseen scheduling conflict. The event opens in forty-eight hours.'\nJulian: 'Let us not panic. Dr. Vance is already registered as an attendee and has published groundbreaking research on that exact topic.'\nSophia: 'Would she be willing to step in on such short notice without a formal rehearsal?'\nJulian: 'I will personally contact her right now and extend an invitation with full honorarium compensation.'", "keyChunks": ["keynote speaker", "unforeseen scheduling conflict", "groundbreaking research", "step in on such short notice", "formal rehearsal", "extend an invitation", "full honorarium compensation"]}, {"id": 9, "title": "The Philosophy of Cittaslow Cities", "genre": "Cultural Essay", "level": "C1", "text": "The international 'Cittaslow' movement arose as a deliberate antidote to the relentless velocity of modern hyper-urbanization. Championing towns with populations under fifty thousand, the philosophy advocates for pedestrianized historic cores, seasonal gastronomic traditions, and the preservation of artisanal craftsmanship. By consciously resisting the homogenizing forces of globalized retail chains, slow cities foster an enviable sense of communal belonging. They demonstrate that true prosperity is measured not by accelerated throughput, but by the depth of human connection and contemplative leisure.", "keyChunks": ["deliberate antidote", "relentless velocity", "hyper-urbanization", "pedestrianized historic cores", "gastronomic traditions", "artisanal craftsmanship", "homogenizing forces", "communal belonging", "accelerated throughput", "contemplative leisure"]}, {"id": 10, "title": "Interface Redesign & User Sentiment", "genre": "Product Review Dialogue", "level": "B2", "text": "David: 'Customer onboarding satisfaction dropped by twelve percent following our latest interface overhaul. Users complain that fundamental settings are obscured.'\nRachel: 'We simplified the navigation hierarchy, but perhaps we were too aggressive in tucking away advanced features.'\nDavid: 'The sentiment analysis indicates that new users find the minimalist design appealing, while veteran power users feel alienated.'\nRachel: 'We should introduce an optional toggle for advanced configuration mode, catering to both cohorts seamlessly.'", "keyChunks": ["customer onboarding satisfaction", "interface overhaul", "fundamental settings are obscured", "navigation hierarchy", "sentiment analysis indicates", "feel alienated", "optional toggle", "catering to both cohorts"]}];
    const SRS_SEED_CARDS = [{"id": 1, "word": "perseverance", "phonetic": "/\u02ccp\u025c\u02d0s\u026a\u02c8v\u026a\u0259r\u0259ns/", "pos": "noun", "level": "B2", "definition": "Continued effort and steadfast determination to achieve something despite difficulties or delays.", "example": "Through sheer perseverance, she completed her master's thesis while working full-time.", "collocations": ["sheer perseverance", "require perseverance", "through perseverance"]}, {"id": 2, "word": "eloquent", "phonetic": "/\u02c8el.\u0259.kw\u0259nt/", "pos": "adjective", "level": "C1", "definition": "Fluent, persuasive, and beautifully expressive in speech or writing.", "example": "The activist delivered an eloquent plea for environmental conservation that moved the audience.", "collocations": ["eloquent speech", "eloquent advocate", "eloquently expressed"]}, {"id": 3, "word": "deteriorate", "phonetic": "/d\u026a\u02c8t\u026a\u0259.ri.\u0259.re\u026at/", "pos": "verb", "level": "B2", "definition": "To become progressively worse in condition, value, or health over time.", "example": "Relations between the neighboring nations deteriorated rapidly after trade talks collapsed.", "collocations": ["deteriorate rapidly", "condition deteriorates", "sharply deteriorate"]}, {"id": 4, "word": "resilience", "phonetic": "/r\u026a\u02c8z\u026al.j\u0259ns/", "pos": "noun", "level": "C1", "definition": "The capacity to recover quickly from adversity, trauma, or setbacks.", "example": "The coastal community demonstrated extraordinary resilience in the aftermath of the storm.", "collocations": ["show resilience", "emotional resilience", "remarkable resilience"]}, {"id": 5, "word": "contemplate", "phonetic": "/\u02c8k\u0252n.t\u0259m.ple\u026at/", "pos": "verb", "level": "B2", "definition": "To think deeply and deliberately about something over a long period.", "example": "He took a sabbatical to contemplate his long-term career aspirations and personal values.", "collocations": ["contemplate a decision", "contemplate the future", "hard to contemplate"]}, {"id": 6, "word": "cynical", "phonetic": "/\u02c8s\u026an.\u026a.k\u0259l/", "pos": "adjective", "level": "B2", "definition": "Distrustful of human sincerity or integrity; believing people are motivated by self-interest.", "example": "Having witnessed broken promises before, voters remained cynical about the candidate's pledge.", "collocations": ["cynical attitude", "deeply cynical", "cynical view"]}, {"id": 7, "word": "ambivalent", "phonetic": "/\u00e6m\u02c8b\u026av.\u0259.l\u0259nt/", "pos": "adjective", "level": "C1", "definition": "Having simultaneous conflicting feelings or attitudes about something.", "example": "She felt profoundly ambivalent about relocating abroad for the promotion.", "collocations": ["feel ambivalent about", "ambivalent attitude", "somewhat ambivalent"]}, {"id": 8, "word": "consensus", "phonetic": "/k\u0259n\u02c8sen.s\u0259s/", "pos": "noun", "level": "B2", "definition": "A general agreement arrived at by a group as a whole.", "example": "After exhaustive debate, the committee finally reached a consensus on the zoning regulations.", "collocations": ["reach a consensus", "broad consensus", "build a consensus"]}, {"id": 9, "word": "sustainable", "phonetic": "/s\u0259\u02c8ste\u026a.n\u0259.b\u0259l/", "pos": "adjective", "level": "B2", "definition": "Able to be maintained at a certain rate without depleting natural resources.", "example": "Transitioning to sustainable agriculture is crucial for global food security.", "collocations": ["sustainable development", "sustainable future", "environmentally sustainable"]}, {"id": 10, "word": "momentum", "phonetic": "/m\u0259\u02c8men.t\u0259m/", "pos": "noun", "level": "B2", "definition": "The driving force or strength gained through sustained forward progress.", "example": "The startup gathered considerable momentum after securing its initial venture funding.", "collocations": ["gain momentum", "lose momentum", "build momentum"]}, {"id": 11, "word": "implication", "phonetic": "/\u02cc\u026am.pl\u026a\u02c8ke\u026a.\u0283\u0259n/", "pos": "noun", "level": "B2", "definition": "A likely consequence or indirect conclusion that can be drawn.", "example": "The executive failed to grasp the legal implications of sharing confidential client data.", "collocations": ["far-reaching implications", "serious implications", "practical implications"]}, {"id": 12, "word": "acknowledge", "phonetic": "/\u0259k\u02c8n\u0252l.\u026ad\u0292/", "pos": "verb", "level": "B2", "definition": "To accept or admit the reality, truth, or existence of a fact.", "example": "The director acknowledged that mistakes were made during the initial production phase.", "collocations": ["readily acknowledge", "fail to acknowledge", "openly acknowledge"]}, {"id": 13, "word": "hypothesis", "phonetic": "/ha\u026a\u02c8p\u0252\u03b8.\u0259.s\u026as/", "pos": "noun", "level": "B2", "definition": "A proposed explanation based on limited evidence, subject to empirical testing.", "example": "The laboratory conducted repeated experiments to validate their initial working hypothesis.", "collocations": ["test a hypothesis", "formulate a hypothesis", "working hypothesis"]}, {"id": 14, "word": "contradict", "phonetic": "/\u02cck\u0252n.tr\u0259\u02c8d\u026akt/", "pos": "verb", "level": "B2", "definition": "To assert the opposite of, or to be logically inconsistent with.", "example": "The witness's new testimony directly contradicts her earlier statement to investigators.", "collocations": ["directly contradict", "evidence contradicts", "contradict yourself"]}, {"id": 15, "word": "elaborate", "phonetic": "/i\u02c8l\u00e6b.\u0259.re\u026at/", "pos": "verb/adj", "level": "B2", "definition": "To explain or add detail; complicated, detailed, and intricate.", "example": "Could you elaborate on the proposed mitigation strategies outlined in section three?", "collocations": ["elaborate on a point", "elaborate plan", "further elaborate"]}, {"id": 16, "word": "ant g things.", "example": "Living in diverse cultures granted her a nuanced perspective on global diplomacy.", "collocations": ["broader perspective", "fresh perspective", "from the perspective of"]}, {"id": 27, "word": "derive", "phonetic": "/d\u026a\u02c8ra\u026av/", "pos": "verb", "level": "B2", "definition": "To obtain, deduce, or trace origin from a specific source.", "example": "Many modern pharmaceutical remedies derive from traditional botanical folklore.", "collocations": ["derive benefit from", "derive pleasure from", "derive from"]}, {"id": 28, "word": "dilemma", "phonetic": "/d\u026a\u02c8lem.\u0259/", "pos": "noun", "level": "B2", "definition": "A difficult predicament requiring a choice between two challenging options.", "example": "The bioethicist faced a painful dilemma regarding patient confidentiality versus public safety.", "collocations": ["face a dilemma", "moral dilemma", "resolve a dilemma"]}, {"id": 29, "word": "phenomenon", "phonetic": "/f\u0259\u02c8n\u0252m.\u026a.n\u0259n/", "pos": "noun", "level": "B2", "definition": "A remarkable or observable event, occurrence, or trend.", "example": "The rapid emergence of digital nomadism is a fascinating socioeconomic phenomenon.", "collocations": ["natural phenomenon", "cultural phenomenon", "widespread phenomenon"]}, {"id": 30, "word": "significant", "phonetic": "/s\u026a\u0261\u02c8n\u026af.\u026a.k\u0259nt/", "pos": "adjective", "level": "B1", "definition": "Having noticeable importance, consequence, or measurable meaning.", "example": "The clinical study recorded a significant drop in blood pressure among test subjects.", "collocations": ["significant improvement", "statistically significant", "significant difference"]}, {"id": 31, "word": "meticulous", "phonetic": "/m\u0259\u02c8t\u026ak.j\u0259.l\u0259s/", "pos": "adjective", "level": "C1", "definition": "Showing immense attention to detail; rigorous, painstaking, and precise.", "example": "The restorer conducted a meticulous cleaning of the centuries-old fresco.", "collocations": ["meticulous attention", "meticulous planning", "meticulously clean"]}, {"id": 32, "word": "pragmatic", "phonetic": "/pr\u00e6\u0261\u02c8m\u00e6t.\u026ak/", "pos": "adjective", "level": "C1", "definition": "Dealing with matters practically and realistically rather than theoretically.", "example": "We need a pragmatic compromise rather than dogmatic ideological warfare.", "collocations": ["pragmatic approach", "pragmatic solution", "remain pragmatic"]}, {"id": 33, "word": "catalyst", "phonetic": "/\u02c8k\u00e6t.\u0259l.\u026ast/", "pos": "noun", "level": "C1", "definition": "An agent, event, or person that triggers or accelerates significant change.", "example": "The unexpected election served as a catalyst for sweeping legislative reforms.", "collocations": ["act as a catalyst", "catalyst for change", "primary catalyst"]}, {"id": 34, "word": "tangible", "phonetic": "/\u02c8t\u00e6n.d\u0292\u0259.b\u0259l/", "pos": "adjective", "level": "B2", "definition": "Perceptible by touch; clear, definite, real, and measurable.", "example": "The green initiative produced tangible savings on the corporation's annual energy bill.", "collocations": ["tangible results", "tangible benefits", "tangible proof"]}, {"id": 35, "word": "vulnerable", "phonetic": "/\u02c8v\u028cl.n\u0259r.\u0259.b\u0259l/", "pos": "adjective", "level": "B2", "definition": "Susceptible to physical or emotional attack, damage, or harm.", "example": "Elderly residents are especially vulnerable during prolonged summer heatwaves.", "collocations": ["highly vulnerable", "vulnerable position", "remain vulnerable"]}, {"id": 36, "word": "nuance", "phonetic": "/\u02c8nju\u02d0.\u0251\u02d0ns/", "pos": "noun", "level": "C1", "definition": "A subtle distinction or variation in shade of meaning, tone, or expression.", "example": "A skilled interpreter catches the subtle nuances of diplomatic courtesy.", "collocations": ["subtle nuance", "appreciate the nuances", "cultural nuances"]}, {"id": 37, "word": "arbitrary", "phonetic": "/\u02c8\u0251\u02d0.b\u026a.tr\u0259r.i/", "pos": "adjective", "level": "C1", "definition": "Based on random choice or personal whim rather than reason or system.", "example": "The committee's decision appeared arbitrary and devoid of empirical justification.", "collocations": ["arbitrary decision", "seem arbitrary", "purely arbitrary"]}, {"id": 38, "word": "coherent", "phonetic": "/k\u0259\u028a\u02c8h\u026a\u0259.r\u0259nt/", "pos": "adjective", "level": "B2", "definition": "Logical, orderly, and cleanly integrated into a whole.", "example": "The researcher presented a coherent narrative connecting historical data with modern trends.", "collocations": ["coherent argument", "coherent strategy", "remain coherent"]}, {"id": 39, "word": "mitigate", "phonetic": "/\u02c8m\u026at.\u026a.\u0261e\u026at/", "pos": "verb", "level": "C1", "definition": "To make less severe, serious, painful, or damaging.", "example": "Installing solar canopies mitigates heat absorption across vast asphalt parking lots.", "collocations": ["mitigate risks", "mitigate the impact", "mitigate the effects"]}, {"id": 40, "word": "paradoxical", "phonetic": "/\u02ccp\u00e6r.\u0259\u02c8d\u0252k.s\u026a.k\u0259l/", "pos": "adjective", "level": "C1", "definition": "Seemingly contradictory or absurd yet expressing an underlying truth.", "example": "It is paradoxical that hyper-connected social networks often foster acute loneliness.", "collocations": ["paradoxical situation", "paradoxical nature", "sound paradoxical"]}];
    const STORIES_432 = [{"id": 1, "title": "The Unmarked Path", "level": "B2-C1", "wordCount": 224, "keywords": ["mountain fork", "stone cottages", "elderly Elena", "off-grid orchards", "celestial rhythm", "hum of highway"], "text": "High in the misty folds of the Rhodope Mountains, Julian took a fork in the trail that appeared on no official cartographic map. Dense pine canopies filtered the afternoon sunlight into emerald beams, and the distant roar of a cascading stream guided his boots downward. After an hour of descent, the forest unexpectedly parted to reveal an isolated settlement of stone cottages with slate roofs, their chimney smoke curling lazily into the crisp alpine air.\n\nAn elderly weaver named Elena greeted him from her wooden porch, neither startled nor suspicious. Instead of treating him as an intruder, she offered a steaming mug of herbal tea infused with mountain mint and honey. The villagers, he soon discovered, were third-generation custodians of ancient terraced orchards, living virtually untethered from the electrical grid and digital communications. Their clock was governed by seasonal harvests and celestial rhythms rather than digital calendars.\n\nJulian stayed until twilight, listening to folklore of subterranean rivers and forgotten silver mines. When he finally climbed back to the modern trailhead, the distant hum of highway traffic felt strangely foreign, like an echo from a world he had outgrown.", "formalPrompt": "Deliver this as an anthropological field briefing to academic peers.", "casualPrompt": "Tell this as a campfire travel story to a close friend over coffee."}, {"id": 2, "title": "The Accidental Catalyst", "level": "B2-C1", "wordCount": 218, "keywords": ["turbine blades", "spilled beaker", "iridescent gel", "tensile strength", "biodegradable", "serendipitous error"], "text": "Dr. Marcus Vance had spent six grueling months attempting to synthesize a heat-resistant coating for marine turbine blades. It was a bleak Tuesday midnight when exhaustion got the better of him. In his haste to clean the workstation, he accidentally knocked a beaker of concentrated citrus ester into a petri dish containing a sluggish polymer solution. Expecting a toxic vapor or scorched glass, he winced and stepped back behind the safety shield.\n\nInstead, a curious reaction unfolded before his eyes. Within ninety seconds, the murky liquid congealed into an iridescent, flexible gel that rapidly hardened at ambient room temperature. When Marcus subjected the unexpected residue to tensile stress and water immersion the following morning, the material exhibited astonishing tensile resilience while breaking down completely in saline water within forty-eight hours.\n\nWhat was intended as a synthetic marine resin had inadvertently yielded a revolutionary, fully biodegradable polymer capable of replacing petroleum packaging. Marcus stared at his laboratory notebook, marveling at the serendipity of human error. Sometimes scientific breakthroughs arrive not through meticulous calculation, but through the grace of an unscripted stumble.", "formalPrompt": "Present this as an executive summary of accidental innovation in materials science.", "casualPrompt": "Tell this as an exciting story about a clumsy mistake that ended up saving the planet."}, {"id": 3, "title": "The Rooftop Sanctuary", "level": "B2", "wordCount": 222, "keywords": ["locked out", "tar rooftop", "wildflower sprout", "wooden pallets", "verdant oasis", "reconnected neighbors"], "text": "For eight relentless years, Clara had inhabited a world of digital spreadsheets, fluorescent cubicles, and commuter trains where no one made eye contact. Her sense of time had flattened into quarterly forecasts and deliverables. One stifling August evening, locked out of her apartment while waiting for a locksmith, she pushed open the rusty emergency door leading to the building's unused flat tar roof.\n\nSpread across the neglected gravel were resilient wildflowers sprouting from cracked asphalt, a windblown dandelion clock, and panoramic vistas of the setting sun casting copper light across the city's glass spires. Right then and there, a quiet spark ignited. Over the next six months, Clara hauled bags of soil, salvaged wooden pallets, and planted heritage tomato vines, fragrant lavender, and pollinator-friendly wildflowers.\n\nThe rooftop transformed into a verdant oasis suspended twelve stories above the ceaseless honking of urban traffic. Neighbors who had lived on the same floor for years without speaking began gathering at dusk to prune basil and share stories over homemade herbal infusions. In reclaiming that forgotten concrete square, Clara had done more than cultivate a garden; she had revived her own dormant vitality and knitted together an alienated urban community.", "formalPrompt": "Frame this as a sociological case study on urban greening and social cohesion.", "casualPrompt": "Share this as an inspiring life-change story you heard about a neighbor in your building."}, {"id": 4, "title": "The Midnight Manuscript", "level": "B2-C1", "wordCount": 215, "keywords": ["burst pipe", "sub-vault crates", "cedar false bottom", "female chemist", "synthetic dyes", "silenced legacy"], "text": "As an assistant archivist at the city's central historical repository, Simon spent his days cataloging municipal land deeds and dusty legislative records. It was meticulous, solitary work that rarely stirred the pulse. That changed when a water pipe burst in the basement sub-vault, forcing staff to urgently evacuate crates of uncataloged donations dating back to the late nineteenth century.\n\nInside a damp, leather-wrapped deed box, Simon felt a false bottom made of cedar veneer. Prying it loose with a bone folder, he uncovered a handwritten manuscript tied with a weathered silk ribbon. The pages belonged to an anonymous female chemist who had worked under a male pseudonym during the industrial revolution. Her detailed sketches and chemical e     // Save helper

      else if (hour >= 18) timeOfDay = "evening";

      if (nameTrimmed.toLowerCase().includes("nhi")) {

    // --- AUDIO SYNTHESIZER ---
    function playChime(type = 'success') {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'tick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
          return;
        }
        // Success 3-tone melodic chime: C5 (523Hz) -> E5 (659Hz) -> G5 (784Hz)
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.12, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.35);
        });
      } catch (e) {
        // AudioContext silent fail
      }
    }

    // --- CONFETTI BURST ---
    function fireConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#FFE500', '#39FF14', '#FFB3C6', '#C9B8FF', '#A8D8FF', '#111827'];
      const particles = [];
      const particleCount = 80;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 200,
          y: canvas.height * 0.4 + (Math.random() - 0.5) * 100,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 12,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rSpeed: (Math.random() - 0.5) * 10,
          life: 1
        });
      }

      let animId;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // gravity
          p.rotation += p.rSpeed;
          p.life -= 0.012;
          if (p.life > 0) {
            alive = true;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });
        if (alive) {
          animId = requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animId);
        }
      }
      render();
    }

    function startTimer() {
      if (APP_STATE.timer.isRunning) return;

      APP_STATE.timer.intervalId = setInterval(() => {
        if (APP_STATE.timer.timeLeft > 0) {

    function updateTimerUI() {
      const ring = document.getElementById('timer-ring');
      const text = document.getElementById('timer-display');
      if (!ring || !text) return;

      const total = APP_STATE.timer.totalTime || 60;
      const left = APP_STATE.timer.timeLeft;
      const radius = 54;
      const circumference = 2 * Math.PI * radius; // ~339.29

      const offset = circumference * (1 - left / total);
      ring.style.strokeDashoffset = offset;

      // Color shifts: > 20s: neon green, 10-20s: neon yellow, < 10s: neon coral
      if (left > 20) {
        ring.style.stroke = "#39FF14"; // Neon green
      } else if (left > 10) {
        ring.style.stroke = "#FFE500"; // Neon yellow

      const mins = Math.floor(left / 60);

      text.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        item.interval = 1;
        item.easeFactor = Math.max(1.3, item.easeFactor - 0.2);

        item.easeFactor = Math.max(1.3, item.easeFactor - 0.15);

        item.reps += 1;
        if (item.reps === 1) item.interval = 1;

        item.reps += 1;
        if (item.reps === 1) item.interval = 2;

      APP_STATE.tech5.passageIndex = parseInt(idx, 10);
      APP_STATE.tech5.step = 'read';
      APP_STATE.tech5.userRecall = '';
      resetTimer(30);
      renderCurrentRoute();
    }

    function setTech5Step(newStep) {
      if (newStep === 'reveal') {
        const input = document.getElementById('tech5-recall-input');
        if (input) APP_STATE.tech5.userRecall = input.value;
      }
      APP_STATE.tech5.step = newStep;
      renderCurrentRoute();
    }

    function highlightKeyChunks(text, chunks) {
      let result = text;
      chunks.forEach((c, idx) => {
        const colors = ['hl-yellow', 'hl-pink', 'hl-blue', 'hl-purple', 'hl-green'];
        const chosenColor = colors[idx % colors.length];
        const regex = new RegExp(`(${c})`, 'gi');
        result = result.replace(regex, `<span class="${chosenColor} font-bold">$1</span>`);
      });
      return result;
    }

    // --- REUSABLE CIRCULAR TIMER COMPONENT ---
    function renderTimerWidget(durationSeconds) {
      const radius = 54;
      const circumference = 2 * Math.PI * radius; // ~339.29
      const mins = Math.floor(durationSeconds / 60);
      const secs = durationSeconds % 60;
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      return `
        <div id="timer-controls-bar" class="card-study p-5 bg-[var(--card)] flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <!-- SVG Animated Ring -->
            <div class="relative w-28 h-28 flex items-center justify-center">
              <svg class="w-full h-full" viewBox="0 0 120 120">
                <!-- Background track -->
                <circle
                  cx="60"
                  cy="60"
                  r="${radius}"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="8"
                  class="text-[#111827]/15"
                />
                <!-- Progress ring -->
                <circle
                  id="timer-ring"
                  cx="60"
                  cy="60"
                  r="${radius}"
                  fill="none"
                  stroke="#39FF14"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="0"
                  class="timer-ring-circle"
                />
              </svg>
              <!-- Center Text -->
              <span id="timer-display" class="absolute font-black text-2xl font-mono text-[var(--foreground)]">
                ${timeStr}
              </span>
            </div>

            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Audio-Cued Timer</span>
              <p class="text-xs text-[var(--foreground)] mt-0.5">Two-tone chime sounds when countdown hits zero.</p>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex items-center gap-2">
            <button id="timer-toggle-btn" onclick="toggleTimer()" class="btn-dark text-sm py-2 px-4">
              <span>▶️ Start</span>
            </button>
            <button onclick="resetTimer(${durationSeconds})" class="btn-secondary text-sm py-2 px-3">
              <span>↺ Reset</span>
            </button>
            <button onclick="addTimerSeconds(15)" class="btn-secondary text-xs py-2 px-2.5">
              <span>+15s</span>
            </button>
          </div>
        </div>
      `;
    }

    function setupTechniqueListeners(techId) {
      // Initialize timer duration for the active technique
      let dur = 60;
      if (techId === 1) dur = 60;
      else if (techId === 2) dur = 60;
      else if (techId === 3) dur = 180;
      else if (techId === 5) dur = 30;
      else if (techId === 7) dur = { 1: 240, 2: 180, 3: 120 }[APP_STATE.tech7.phase] || 240;

      APP_STATE.timer.timeLeft = dur;
      APP_STATE.timer.totalTime = dur;
      APP_STATE.timer.isRunning = false;
      APP_STATE.timer.onComplete = () => {
        if (techId === 1) APP_STATE.tech1.isRevealed = true;
        renderCurrentRoute();
      };
      updateTimerUI();
    }

    // --- PROGRESS SCREEN ---
    function renderProgressScreen() {
      // 30-Day Heatmap Data
      const today = new Date();
      const past30Days = [];
      const sessionDateCounts = {};

      APP_STATE.sessions.forEach(s => {
        sessionDateCounts[s.date] = (sessionDateCounts[s.date] || 0) + 1;
      });

      for (let i = 29; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const dStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        past30Days.push({
          date: dStr,
          dayNum: d.getDate(),
          count: sessionDateCounts[dStr] || 0
        });
      }

      // Technique breakdown count
      const techCounts = {};
      TECHNIQUES.forEach(t => techCounts[t.id] = 0);
      APP_STATE.sessions.forEach(s => {
        if (techCounts[s.techniqueId] !== undefined) techCounts[s.techniqueId]++;
      });
      const maxTechCount = Math.max(1, ...Object.values(techCounts));

      // SRS Mastery
      const srsCards = Object.values(APP_STATE.srs);
      const mastered = srsCards.filter(c => c.reps >= 3).length;
      const learning = srsCards.filter(c => c.reps > 0 && c.reps < 3).length;
      const unseen = Math.max(0, 40 - mastered - learning);

      return `

                  <div
                    title="${d.date}: ${d.count} session(s)"

              <div class="flex items-center gap-1.5">
                <span>Less</span>
                <span class="w-3 h-3 rounded bg-[var(--background)] border border-[#111827]"></span>
                <span class="w-3 h-3 rounded bg-[#39FF14]/50 border border-[#111827]"></span>
                <span class="w-3 h-3 rounded bg-[#39FF14] border border-[#111827]"></span>
                <span>More</span>
              </div>
              <span>Today</span>
            </div>
          </div>

          <!-- Technique Distribution Bar Chart -->
          <div class="card-study p-6 bg-[var(--card)] space-y-4">
            <span class="badge-chip bg-[#FFE500] text-[#111827]">Techniques Practiced Distribution</span>

            <div class="space-y-3">
              ${TECHNIQUES.map(tech => {
                const count = techCounts[tech.id] || 0;
                const widthPct = Math.round((count / maxTechCount) * 100);
                return `
                  <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                      <span class="text-[var(--foreground)]">${tech.id}. ${tech.title}</span>
                      <span class="text-[var(--muted-foreground)]">${count} session${count === 1 ? '' : 's'}</span>
                    </div>
                    <div class="w-full h-3.5 bg-[var(--background)] border-1.5 border-[#111827] rounded-full overflow-hidden flex">
                      <div
                        class="h-full rounded-full transition-all duration-500"
                        style="width: ${Math.max(5, widthPct)}%; background-color: ${tech.tagColor}; border-right: 1.5px solid #111827;"
                      ></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- SRS Vocabulary Mastery -->
          <div class="card-study p-5 bg-[var(--card)] space-y-3">
            <span class="badge-chip bg-[#C9B8FF] text-[#111827]">C1 Spaced Repetition Mastery</span>
            <div class="grid grid-cols-3 gap-3 text-center">
              <div class="p-3 bg-[#39FF14]/30 border-2 border-[#111827] rounded-xl">
                <span class="text-xs font-bold uppercase text-[var(--muted-foreground)]">Mastered (3+ reps)</span>
                <p class="text-2xl font-black text-[var(--foreground)] mt-0.5">${mastered}</p>
              </div>
              <div class="p-3 bg-[#FFE500]/30 border-2 border-[#111827] rounded-xl">
                <span class="text-xs font-bold uppercase text-[var(--muted-foreground)]">Learning (1-2 reps)</span>
                <p class="text-2xl font-black text-[var(--foreground)] mt-0.5">${learning}</p>
              </div>
              <div class="p-3 bg-[var(--background)] border-2 border-[#111827] rounded-xl">
                <span class="text-xs font-bold uppercase text-[var(--muted-foreground)]">Unseen</span>
                <p class="text-2xl font-black text-[var(--foreground)] mt-0.5">${unseen}</p>
              </div>
            </div>
          </div>

          <!-- Recent Sessions Log -->
          <div class="card-study p-5 bg-[var(--card)] space-y-3">
            <span class="badge-chip bg-[#A8D8FF] text-[#111827]">Recent Practice Log</span>
            <div class="space-y-2 max-h-60 overflow-y-auto">
              ${APP_STATE.sessions.length ? APP_STATE.sessions.slice(0, 8).map(s => `
                <div class="p-3 bg-[var(--background)] border border-[#111827] rounded-lg flex items-center justify-between text-xs">
                  <div>
                    <strong class="font-bold text-[var(--foreground)]">${s.techniqueName}</strong>
                    <p class="text-[11px] text-[var(--muted-foreground)]">${s.date} at ${s.time} • ${s.notes || 'In-app practice'}</p>
                  </div>
                  <span class="badge-chip bg-[#FFE500] text-[#111827] text-[10px]">${s.durationMinutes}m</span>
                </div>
              `).join('') : `
                <p class="text-xs text-[var(--muted-foreground)] italic text-center py-4">No sessions logged yet. Complete today's session to start your log!</p>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // --- SETTINGS SCREEN ---
    function renderSettingsScreen() {
      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-3xl font-black tracking-tight text-[var(--foreground)]">Settings & Profile</h1>
            <p class="text-sm text-[var(--muted-foreground)] font-medium mt-1">
              Customize your learning companion and manage data.
            </p>
          </div>

          <!-- Profile Settings -->
          <div class="card-study p-6 bg-[var(--card)] space-y-4">
            <span class="badge-chip bg-[#FFE500] text-[#111827]">Learner Profile</span>

            <div>
              <label class="text-xs font-bold text-[var(--foreground)] block mb-1">Your Name / Nickname:</label>
              <div class="flex gap-2">
                <input
                  type="text"
                  id="settings-name-input"
                  value="${APP_STATE.userName}"
                  class="flex-1 p-2.5 text-sm bg-[var(--background)] text-[var(--foreground)] border-2 border-[#111827] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#FFE500]"
                >
                <button onclick="saveProfileName()" class="btn-dark text-xs py-2 px-4">
                  Save Name
                </button>
              </div>
            </div>

            <div class="pt-2">
              <label class="text-xs font-bold text-[var(--foreground)] block mb-1">Daily Target Practice Time:</label>
              <div class="flex gap-2 text-xs">
                <button onclick="saveTargetMinutes(10)" class="badge-chip cursor-pointer py-1.5 px-3 ${APP_STATE.settings.targetMinutes === 10 ? 'bg-[#39FF14] text-[#111827]' : 'bg-[var(--card)] text-[var(--foreground)]'}">10 min / day</button>
                <button onclick="saveTargetMinutes(15)" class="badge-chip cursor-pointer py-1.5 px-3 ${APP_STATE.settings.targetMinutes === 15 ? 'bg-[#39FF14] text-[#111827]' : 'bg-[var(--card)] text-[var(--foreground)]'}">15 min / day (Recommended)</button>
                <button onclick="saveTargetMinutes(20)" class="badge-chip cursor-pointer py-1.5 px-3 ${APP_STATE.settings.targetMinutes === 20 ? 'bg-[#39FF14] text-[#111827]' : 'bg-[var(--card)] text-[var(--foreground)]'}">20 min / day</button>
              </div>
            </div>
          </div>

          <!-- Technique Management -->
          <div class="card-study p-6 bg-[var(--card)] space-y-3">
            <span class="badge-chip bg-[#C9B8FF] text-[#111827]">Daily Technique Controls</span>
            <p class="text-xs text-[var(--foreground)]">
              Today's technique is automatically pinned for the calendar day. Want to practice a different random technique today?
            </p>
            <button onclick="rerollDailyTechnique()" class="btn-secondary text-xs">
              🎲 Re-roll Today's Assigned Technique
            </button>
          </div>

          <!-- Data Backup & Reset -->
          <div class="card-study p-6 bg-[var(--card)] space-y-4">
            <span class="badge-chip bg-[#FFB3C6] text-[#111827]">Data Backup & Export</span>

            <div class="flex flex-wrap gap-2">
              <button onclick="exportDataJSON()" class="btn-secondary text-xs">
                ⬇️ Export All Data (JSON)
              </button>
              <label class="btn-secondary text-xs cursor-pointer">
                <span>⬆️ Import Data (JSON)</span>
                <input type="file" accept=".json" class="hidden" onchange="importDataJSON(event)">
              </label>
              <button onclick="confirmResetData()" class="btn-secondary text-xs hover:bg-red-200">
                ⚠️ Reset Streak & Progress
              </button>
            </div>
          </div>

          <!-- B1→C1 Science Rationale -->
          <div class="card-study p-6 bg-[var(--card)] space-y-3">
            <span class="badge-chip bg-[#A8D8FF] text-[#111827]">The B1→C1 Fluency Science</span>
            <div class="text-xs text-[var(--foreground)] space-y-2 leading-relaxed">
              <p>• <strong>Circumlocution:</strong> The single biggest difference between B1 and C1 is the ability to bypass missing vocabulary by describing traits and analogies smoothly.</p>
              <p>• <strong>Paul Nation's 4-3-2 Technique:</strong> Research in TESOL shows that repeating the same story with decreasing time constraints significantly reduces hesitations and increases spoken syllables per minute.</p>
              <p>• <strong>Collocation Frames:</strong> Native English is stored in phrasal chunks ("make an effort", "take into account"), not isolated grammar rules. Mastering chunks eliminates translation lag.</p>
            </div>
          </div>
        </div>
      `;
    }

    function saveProfileName() {
      const input = document.getElementById('settings-name-input');
      if (input && input.value.trim()) {
        APP_STATE.userName = input.value.trim();
        saveState('eng_user_name', APP_STATE.userName);
        playChime('tick');
        alert(`Name updated to "${APP_STATE.userName}"!`);
        renderCurrentRoute();
      }
    }

    function saveTargetMinutes(m) {
      APP_STATE.settings.targetMinutes = m;
      saveState('eng_settings', APP_STATE.settings);
      playChime('tick');
      renderCurrentRoute();
    }

    function rerollDailyTechnique() {
      const cur = APP_STATE.todayTechnique ? APP_STATE.todayTechnique.techniqueId : 1;
      let nextId = (cur % 7) + 1;
      APP_STATE.todayTechnique = {
        date: getTodayDateString(),
        techniqueId: nextId
      };
      saveState('eng_today_technique', APP_STATE.todayTechnique);
      playChime('tick');
      alert(`Today's focus shifted to Technique #${nextId}: ${TECHNIQUES[nextId - 1].title}!`);
    }

    function exportDataJSON() {
      const backup = {
        userName: APP_STATE.userName,
        streak: APP_STATE.streak,
        sessions: APP_STATE.sessions,
        srs: APP_STATE.srs,
        settings: APP_STATE.settings,
        exportDate: new Date().toISOString()
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `fluency-forge-backup-${getTodayDateString()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importDataJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed.userName) APP_STATE.userName = parsed.userName;
          if (parsed.streak) APP_STATE.streak = parsed.streak;
          if (parsed.sessions) APP_STATE.sessions = parsed.sessions;
          if (parsed.srs) APP_STATE.srs = parsed.srs;
          saveState('eng_user_name', APP_STATE.userName);
          saveState('eng_streak', APP_STATE.streak);
          saveState('eng_sessions', APP_STATE.sessions);
          saveState('eng_srs_state', APP_STATE.srs);
          updateHeaderStreak();
          alert("Backup successfully restored!");
          renderCurrentRoute();
        } catch (err) {
          alert("Invalid backup JSON file.");
        }
      };
      reader.readAsText(file);
    }

    function confirmResetData() {
      if (confirm("Are you sure you want to reset your streak, session history, and flashcard SRS data? This cannot be undone.")) {
        APP_STATE.streak = { count: 1, lastDate: "" };
        APP_STATE.sessions = [];
        APP_STATE.srs = {};
        saveState('eng_streak', APP_STATE.streak);
        saveState('eng_sessions', APP_STATE.sessions);
        saveState('eng_srs_state', APP_STATE.srs);
        updateHeaderStreak();
        alert("Progress reset.");
        renderCurrentRoute();
      }
    }

    // --- COMPLETION MODAL ---
    function showCompletionModal(tech, duration) {
      const modal = document.getElementById('modal-container');
      if (!modal) return;
      modal.innerHTML = `
        <div class="card-study p-6 bg-[var(--card)] max-w-sm w-full text-center space-y-4">
          <div class="w-16 h-16 rounded-2xl bg-[#FFE500] border-2 border-[#111827] flex items-center justify-center text-3xl mx-auto shadow-[2px_2px_0px_#111827]">
            <span class="flame-animated">🔥</span>
          </div>

          <div>
            <h3 class="text-2xl font-black text-[var(--foreground)]">Practice Completed!</h3>
            <p class="text-xs text-[var(--muted-foreground)] mt-1">
              You logged <strong>${duration} minutes</strong> of deliberate English practice with <strong>${tech.title}</strong>.
            </p>
          </div>

          <div class="p-3 bg-[#FFE500]/25 border-2 border-[#111827] rounded-xl text-xs font-bold text-[#111827]">
            🔥 Streak updated to ${APP_STATE.streak.count} consecutive days!
          </div>

          <div class="flex flex-col gap-2 pt-2">
            <button onclick="closeModal(); navigate('home');" class="btn-dark text-xs py-2.5">
              Return to Dashboard
            </button>
            <button onclick="closeModal(); navigate('progress');" class="btn-secondary text-xs py-2">
              View Updated Heatmap
            </button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      if (modal) modal.classList.add('hidden');
    }

    // Keyboard shortcuts: Space to flip flashcard, 1-4 for ratings
    document.addEventListener('keydown', (e) => {
      if (APP_STATE.currentRoute === 'technique' && APP_STATE.activeTechId === 6) {
        if (e.code === 'Space') {
          e.preventDefault();
          flipFlashcard();
        } else if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code) && APP_STATE.tech6.isFlipped) {
          const num = parseInt(e.code.replace('Digit', ''), 10);
          const due = getDueSRSCards();
          const card = due[APP_STATE.tech6.currentIndex] || due[0];
          if (card) handleSRSRating(card.id, num);
        }
      }
    });

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      // Header date
      const d = new Date();
      const dateEl = document.getElementById('header-date');
      if (dateEl) {
        dateEl.innerText = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      }

      // Check onboarding
      if (!localStorage.getItem('eng_user_name')) {
        // Pre-set default to Nhi's Buddy
        localStorage.setItem('eng_user_name', "Nhi's Buddy");
        APP_STATE.userName = "Nhi's Buddy";
      }

      updateHeaderStreak();
      initTodayTechnique();
      navigate('home');
    });
  </script>
</body>
</html>
