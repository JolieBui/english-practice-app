<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Fluency Forge — Daily English Practice</title>
  <script src='https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js'></script>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #111827;
      --card: #f9fafb;
      --border: #e5e7eb;
      --muted-foreground: #6b7280;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: #111827;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .neo-card {
      background: #ffffff;
      border: 2px solid #111827;
      box-shadow: 3px 3px 0 #111827;
      border-radius: 12px;
      transition: all 0.15s ease;
    }

    .neo-card-sm {
      background: #ffffff;
      border: 2px solid #111827;
      box-shadow: 2px 2px 0 #111827;
      border-radius: 8px;
    }

    .neo-btn {
      border: 2px solid #111827;
      box-shadow: 2px 2px 0 #111827;
      font-weight: 700;
      transition: all 0.1s ease;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .neo-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 #111827;
    }
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #111827;
    }

    .badge-chip {
      border: 1.5px solid #111827;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .hl-yellow { background: #FFE500; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .hl-pink { background: #FFB3C6; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .hl-purple { background: #C9B8FF; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .hl-blue { background: #A8D8FF; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .hl-green { background: #39FF14; padding: 1px 4px; border-radius: 3px; font-weight: 600; }

    .perspective-1000 { perspective: 1000px; }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 260px;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      top: 0;
      left: 0;
      border-radius: 12px;
      border: 2px solid #111827;
      box-shadow: 3px 3px 0 #111827;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    @keyframes flamePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18) rotate(4deg); }
    }
    .flame-anim {
      display: inline-block;
      animation: flamePulse 1.8s infinite ease-in-out;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    @media print {
      header, nav, #bottom-nav, .no-print, button {
        display: none !important;
      }
      .print-area {
        display: block !important;
        width: 100% !important;
        color: black !important;
        background: white !important;
      }
      .neo-card {
        box-shadow: none !important;
        border: 1px solid #111827 !important;
      }
    }
    @media screen {
      .print-only {
        display: none !important;
      }
    }
  </style>
</head>

hout drawback.", "b1Definition": "a difficult situation where you must choose between two hard choices.", "forbidden": ["choice", "problem", "decision"]}, {"word": "articulate", "phonetic": "/\u0251\u02d0\u02c8t\u026ak.j\u0259.l\u0259t/", "level": "C1", "definition": "Having or showing the ability to express ideas clearly, coherently, and effectively.", "example": "She is an articulate advocate who can explain complex financial concepts to anyone.", "collocations": ["articulate speaker", "highly articulate", "articulate an argument", "clearly articulate"], "hint": "Adjective/Verb. Expressing thoughts cleanly without stumbling or sounding confused.", "b1Definition": "able to express thoughts and ideas clearly in words.", "forbidden": ["clear", "express", "talk"]}, {"word": "profound", "phonetic": "/pr\u0259\u02c8fa\u028and/", "level": "C1", "definition": "Having immense intellectual depth, intensity, or far-reaching consequences.", "example": "Reading the philosopher's autobiography had a profound impact on my perspective.", "collocations": ["profound impact", "profound effect", "profound insight", "profound change"], "hint": "Adjective. Extremely deep, intense, or transformative; the polar opposite of superficial.", "b1Definition": "very deep, powerful, or having a big meaning.", "forbidden": ["deep", "big", "great"]}, {"word": "undermine", "phonetic": "/\u02cc\u028cn.d\u0259\u02c8ma\u026an/", "level": "C1", "definition": "To weaken or diminish the effectiveness, confidence, or authority of someone/something gradually.", "example": "Constant micromanagement will undermine your team's motivation and autonomy.", "collocations": ["undermine confidence", "undermine authority", "seriously undermine", "subtly undermine"], "hint": "Verb. To secretly or slowly dig away the ground beneath something so it collapses.", "b1Definition": "to make someone or something weaker step by step.", "forbidden": ["weaken", "ruin", "damage"]}, {"word": "cynical", "phonetic": "/\u02c8s\u026a g phenomenon"], "hint": "Noun. An extraordinary or curious occurrence that people observe and study.", "b1Definition": "an interesting or unusual event that happens in nature or society.", "forbidden": ["event", "wonder", "nature"]}];

Don't say 'make an impression that' \u274c. Say 'give an impression that' \u2714\ufe0f.", "example": "Her relaxed posture gave the distinct impression that she was completely confident."}, {"id": 35, "frame": "pose a threat to", "pattern": "pose a threat to + noun", "level": "B2", "meaning": "To represent a genuine danger, hazard, or risk to safety/survival.", "mistake": "Don't say 'place a threat to' \u274c. Say 'pose a threat to' \u2714\ufe0f.", "example": "Habitat fragmentation poses an acute threat to native bird species."}, {"id": 36, "frame": "draw attention to", "pattern": "draw attention to + noun", "level": "B2", "meaning": "To consciously direct people's focus or notice toward a specific detail.", "mistake": "Don't say 'call attention at' \u274c. Say 'draw attention to' \u2714\ufe0f.", "example": "I'd like to draw your attention to the sudden spike in user engagement."}, {"id": 37, "frame": "take for granted", "pattern": "take + someone/something + for granted", "level": "B2", "meaning": "To assume something will always be present without valuing or appreciating it.", "mistake": "Don't say 'take as granted' \u274c. Say 'take for granted' \u2714\ufe0f.", "example": "We often take clean municipal water for granted until a pipe bursts."}, {"id": 38, "frame": "in the long run", "pattern": "in the long run", "level": "B1", "meaning": "Over an extended period of time in the distant future; ultimately.", "mistake": "Don't say 'at the long run' \u274c. Say 'in the long run' \u2714\ufe0f.", "example": "Building strong language foundations takes patience, but pays off in the long run."}, {"id": 39, "frame": "speak one's mind", "pattern": "speak + one's mind", "level": "B2", "meaning": "To state one's candid convictions openly and without hesitation.", "mistake": "Don't say 'tell one's mind' \u274c. Say 'speak one's mind' \u2714\ufe0f.", "example": "She is deeply respected by colleagues because she always speaks her mind respectfully."}, {"id": 40, "frame": "bridge the gap", "pattern": "bridge the gap + between A and B", "level": "C1", "meaning": "To connect or reconcile two differing viewpoints, cohorts, or levels.", "mistake": "Don't say 'cross the gap' \u274c. Say 'bridge the gap' \u2714\ufe0f.", "example": "This mentorship initiative bridges the gap between academic theory and practical work."}, {"id": 41, "frame": "exercise caution", "pattern": "exercise caution (+ when -ing)", "level": "C1", "meaning": "To act prudently, carefully, and with deliberate restraint.", "mistake": "Don't say 'make caution' \u274c. Say 'exercise caution' \u2714\ufe0f.", "example": "Hikers must exercise caution when traversing narrow ridge pathways in dense fog."}, {"id": 42, "frame": "leave much to be desired", "pattern": "leave much to be desired", "level": "C1", "meaning": "To be substantially flawed, deficient, or unsatisfactory.", "mistake": "Don't say 'leave many desires' \u274c. Say 'leave much to be desired' \u2714\ufe0f.", "example": "While the prototype looks sleek, its battery longevity leaves much to be desired."}, {"id": 43, "frame": "on the verge of", "pattern": "on the verge of + noun / -ing", "level": "B2", "meaning": "Very close to experiencing, discovering, or achieving something.", "mistake": "Don't say 'in the verge' \u274c. Say 'on the verge of' \u2714\ufe0f.", "example": "Astrophysicists believe they are on the verge of confirming signs of atmospheric water."}, {"id": 44, "frame": "harbor doubts", "pattern": "harbor doubts (+ about)", "level": "C1", "meaning": "To hold secret, lingering uncertainties or suspicions inside.", "mistake": "Don't say 'keep doubts inside' \u274c. Say 'harbor doubts' \u2714\ufe0f.", "example": "Although she voted with the majority, she still harbored private doubts."}, {"id": 45, "frame": "reap the benefits", "pattern": "reap the benefits (+ of)", "level": "B2", "meaning": "To collect the positive harvest, rewards, or advantages of earlier labor.", "mistake": "Don't say 'harvest the benefits' \u274c. Say 'reap the benefits' \u2714\ufe0f.", "example": "Those who established daily speaking routines are now reaping the benefits in interviews."}, {"id": 46, "frame": "under the assumption that", "pattern": "under the assumption that + clause", "level": "B2", "meaning": "Believing something to be true as the operational premise.", "mistake": "Don't say 'in assumption that' \u274c. Say 'under the assumption that' \u2714\ufe0f.", "example": "We formulated the launch timeline under the assumption that testing would take two weeks."}, {"id": 47, "frame": "come to a halt", "pattern": "come to a halt", "level": "B2", "meaning": "To cease movement, progression, or operational activity completely.", "mistake": "Don't say 'get to a halt' \u274c. Say 'come to a halt' \u2714\ufe0f.", "example": "Assembly line production came to a grinding halt when the power grid surged."}, {"id": 48, "frame": "weigh the pros and cons", "pattern": "weigh the pros and cons (+ of)", "level": "B2", "meaning": "To carefully evaluate the positive versus negative aspects of a choice.", "mistake": "Don't say 'measure pros and cons' \u274c. Say 'weigh the pros and cons' \u2714\ufe0f.", "example": "Before resigning to launch a startup, take time to weigh the pros and cons thoroughly."}, {"id": 49, "frame": "gain insight into", "pattern": "gain insight into + topic", "level": "C1", "meaning": "To achieve a profound, illuminating understanding of a complex matter.", "mistake": "Don't say 'get sight inside' \u274c. Say 'gain insight into' \u2714\ufe0f.", "example": "Shadowing the frontline customer support team helped engineers gain insight into user pain."}, {"id": 50, "frame": "take pride in", "pattern": "take pride in + noun / -ing", "level": "B2", "meaning": "To feel deep personal satisfaction and honor regarding one's work.", "mistake": "Don't say 'have proud in' \u274c. Say 'take pride in' \u2714\ufe0f.", "example": "Our artisanal carpenters take immense pride in hand-fitting every joint."}, {"id": 51, "frame": "make a difference", "pattern": "make a difference (+ to/in)", "level": "B1", "meaning": "To have a tangible, meaningful positive impact on a situation.", "mistake": "Don't say 'do a difference' \u274c. Say 'make a difference' \u2714\ufe0f.", "example": "Even ten minutes of focused retrieval practice every day will make a massive difference."}, {"id": 52, "frame": "keep in mind", "pattern": "keep + in mind (+ that)", "level": "B1", "meaning": "To maintain conscious awareness of an essential fact.", "mistake": "Don't say 'keep in the head' \u274c. Say 'keep in mind' \u2714\ufe0f.", "example": "Keep in mind that mistakes are not failures; they are the raw fuel of neural adaptation."}];
    const PASSAGES_DATA = [{"id": 1, "title": "Urban Green Corridors & Micro-Climates", "genre": "News Report", "level": "B2", "text": "Urban centers worldwide are accelerating investments in micro-forests and green corridors to mitigate heat island effects. Recent meteorological data indicates that planting native trees along pedestrian avenues can reduce ambient surface temperatures by up to four degrees Celsius. Moreover, these green buffer zones absorb substantial urban runoff during severe downpours, diminishing the frequency of flash floods. City planners argue that prioritizing biodiversity is no longer merely aesthetic, but rather an indispensable component of resilient municipal infrastructure in an unpredictable climate.", "keyChunks": ["accelerating investments", "mitigate heat island effects", "meteorological data indicates", "ambient surface temperatures", "green buffer zones", "diminishing the frequency", "indispensable component", "resilient municipal infrastructure"]}, {"id": 2, "title": "Sprint Velocity & Roadmap Prioritization", "genre": "Workplace Dialogue", "level": "B2", "text": "Liam: 'Have you had a chance to review the updated sprint velocity? If we persist with the initial roadmap, we run a considerable risk of burnout before launch.'\nMaya: 'I share your apprehension. However, scaling back the core deliverables might jeopardize our stakeholder consensus. What if we defer the analytics module to phase two?'\nLiam: 'That strikes a reasonable compromise. It affords the front-end engineers sufficient breathing room to stabilize the authentication flow without sacrificing our launch date.'", "keyChunks": ["updated sprint velocity", "persist with the initial roadmap", "run a considerable risk of", "share your apprehension", "jeopardize our stakeholder consensus", "defer the analytics module", "strikes a reasonable compromise", "sufficient breathing room"]}, {"id": 3, "title": "The Psychology of Remote Work & Solitude", "genre": "Opinion Editorial", "level": "B2-C1", "text": "While asynchronous remote work undeniably liberated employees from the drudgery of lengthy commutes, it subtly introduced a more pernicious challenge: cognitive isolation. Without spontaneous watercooler exchanges, interdepartmental empathy gradually erodes, replaced by transactional message threads. True workplace innovation rarely thrives in an echo chamber of scheduled calendar invites; it demands unexpected friction, serendipitous debates, and shared laughter. Organizations that fail to intentionally cultivate spontaneous informal spaces will find their operational efficiency intact, but their creative spark fundamentally extinguished.", "keyChunks": ["drudgery of lengthy commutes", "pernicious challenge", "cognitive isolation", "spontaneous watercooler exchanges", "interdepartmental empathy", "transactional message threads", "echo chamber", "serendipitous debates", "cultivate spontaneous informal spaces", "creative spark fundamentally extinguished"]}, {"id": 4, "title": "Neural Networks in Medical Imaging", "genre": "Science & Tech", "level": "B2", "text": "Machine learning algorithms are transforming diagnostic radiology by identifying subtle microcalcifications long before they become palpable to clinical oncologists. Rather than replacing medical practitioners, these neural networks serve as tireless second readers, flagging anomalous tissue scans with remarkable fidelity. Extensive clinical trials demonstrate that diagnostic accuracy surges when human intuition collaborates symbiotically with automated pattern recognition. The principal impediment moving forward is not technological efficacy, but rather establishing ethical transparency regarding how algorithmic recommendations are formulated.", "keyChunks": ["diagnostic radiology", "palpable to clinical oncologists", "tireless second readers", "remarkable fidelity", "extensive clinical trials", "diagnostic accuracy surges", "collaborates symbiotically", "automated pattern recognition", "principal impediment", "ethical transparency"]}, {"id": 5, "title": "Balancing Departmental Budgets", "genre": "Business Dialogue", "level": "B2", "text": "Elena: 'The board has mandated an across-the-board ten percent expenditure reduction across all operational departments before the fourth quarter.'\nMarcus: 'Executing a uniform cut is counterproductive. Our customer retention team is operating at full capacity; trimming their headcount will inevitably erode client loyalty.'\nElena: 'What alternative do you propose? We must present a balanced sheet by Friday morning.'\nMarcus: 'Let us consolidate our redundant software subscriptions first. We can eliminate duplicate cloud tooling before touching personnel.'", "keyChunks": ["across-the-board", "expenditure reduction", "counterproductive", "operating at full capacity", "inevitably erode client loyalty", "consolidate our redundant software", "eliminate duplicate cloud tooling", "touching personnel"]}, {"id": 6, "title": "The Power of Incremental Micro-Habits", "genre": "Self-Improvement Essay", "level": "B1-B2", "text": "Most people mistakenly assume that monumental transformations necessitate radical upheavals in daily routine. In reality, behavioral psychology demonstrates that tiny, incremental micro-habits yield far more sustainable outcomes. Dedicating just ten focused minutes each morning to language immersion or journaling leverages the compound effect over months. Because micro-habits demand minimal initial willpower, they easily bypass our innate resistance to change. Consistency, rather than sporadic intensity, remains the undisputed catalyst for enduring personal mastery.", "keyChunks": ["monumental transformations", "radical upheavals", "behavioral psychology demonstrates", "incremental micro-habits", "sustainable outcomes", "compound effect", "minimal initial willpower", "innate resistance to change", "sporadic intensity", "undisputed catalyst"]}, {"id": 7, "title": "Biometric Surveillance in Public Squares", "genre": "Academic Reflection", "level": "C1", "text": "The proliferation of biometric surveillance in public squares poses an unsettling dilemma for democratic governance. Proponents justify ubiquitous facial recognition under the banner of civic security and proactive crime prevention. Yet this utilitarian rationale discounts the profound psychological toll of perpetual observation. When citizens internalize the notion that every glance and gesture is monitored and logged, spontaneous civic assembly and nonconformist expression inevitably wither. Security purchased at the expense of authentic civil liberty is a pyrrhic victory.", "keyChunks": ["proliferation of biometric surveillance", "unsettling dilemma", "democratic governance", "ubiquitous facial recognition", "utilitarian rationale", "perpetual observation", "spontaneous civic assembly", "nonconformist expression", "civil liberty", "pyrrhic victory"]}, {"id": 8, "title": "Emergency Symposium Keynote Replacement", "genre": "Coordination Dialogue", "level": "B2", "text": "Sophia: 'The keynote speaker for the European symposium just cancelled due to an unforeseen scheduling conflict. The event opens in forty-eight hours.'\nJulian: 'Let us not panic. Dr. Vance is already registered as an attendee and has published groundbreaking research on that exact topic.'\nSophia: 'Would she be willing to step in on such short notice without a formal rehearsal?'\nJulian: 'I will personally contact her right now and extend an invitation with full honorarium compensation.'", "keyChunks": ["keynote speaker", "unforeseen scheduling conflict", "groundbreaking research", "step in on such short notice", "formal rehearsal", "extend an invitation", "full honorarium compensation"]}, {"id": 9, "title": "The Philosophy of Cittaslow Cities", "genre": "Cultural Essay", "level": "C1", "text": "The international 'Cittaslow' movement arose as a deliberate antidote to the relentless velocity of modern hyper-urbanization. Championing towns with populations under fifty thousand, the philosophy advocates for pedestrianized historic cores, seasonal gastronomic traditions, and the preservation of artisanal craftsmanship. By consciously resisting the homogenizing forces of globalized retail chains, slow cities foster an enviable sense of communal belonging. They demonstrate that true prosperity is measured not by accelerated throughput, but by the depth of human connection and contemplative leisure.", "keyChunks": ["deliberate antidote", "relentless velocity", "hyper-urbanization", "pedestrianized historic cores", "gastronomic traditions", "artisanal craftsmanship", "homogenizing forces", "communal belonging", "accelerated throughput", "contemplative leisure"]}, {"id": 10, "title": "Interface Redesign & User Sentiment", "genre": "Product Review Dialogue", "level": "B2", "text": "David: 'Customer onboarding satisfaction dropped by twelve percent following our latest interface overhaul. Users complain that fundamental settings are obscured.'\nRachel: 'We simplified the navigation hierarchy, but perhaps we were too aggressive in tucking away advanced features.'\nDavid: 'The sentiment analysis indicates that new users find the minimalist design appealing, while veteran power users feel alienated.'\nRachel: 'We should introduce an optional toggle for advanced configuration mode, catering to both cohorts seamlessly.'", "keyChunks": ["customer onboarding satisfaction", "interface overhaul", "fundamental settings are obscured", "navigation hierarchy", "sentiment analysis indicates", "feel alienated", "optional toggle", "catering to both cohorts"]}];
    const SRS_SEED_CARDS = [{"id": 1, "word": "perseverance", "phonetic": "/\u02ccp\u025c\u02d0s\u026a\u02c8v\u026a\u0259r\u0259ns/", "pos": "noun", "level": "B2", "definition": "Continued effort and steadfast determination to achieve something despite difficulties or delays.", "example": "Through sheer perseverance, she completed her master's thesis while working full-time.", "collocations": ["sheer perseverance", "require perseverance", "through perseverance"], "b1Definition": "continuing to try hard even when things are difficult."}, {"id": 2, "word": "eloquent", "phonetic": "/\u02c8el.\u0259.kw\u0259nt/", "pos": "adjective", "level": "C1", "definition": "Fluent, persuasive, and beautifully expressive in speech or writing.", "example": "The activist delivered an eloquent plea for environmental conservation that moved the audience.", "collocations": ["eloquent speech", "eloquent advocate", "eloquently expressed"], "b1Definition": "able to speak or write clearly, beautifully, and persuasively."}, {"id": 3, "word": "deteriorate", "phonetic": "/d\u026a\u02c8t\u026a\u0259.ri.\u0259.re\u026at/", "pos": "verb", "level": "B2", "definition": "To become progressively worse in condition, value, or health over time.", "example": "Relations between the neighboring nations deteriorated rapidly after trade talks collapsed.", "collocations": ["deteriorate rapidly", "condition deteriorates", "sharply deteriorate"], "b1Definition": "to become worse slowly over time."}, {"id": 4, "word": "resilience", "phonetic": "/r\u026a\u02c8z\u026al.j\u0259ns/", "pos": "noun", "level": "C1", "definition": "The capacity to recover quickly from adversity, trauma, or setbacks.", "example": "The coastal community demonstrated extraordinary resilience in the aftermath of the storm.", "collocations": ["show resilience", "emotional resilience", "remarkable resilience"], "b1Definition": "the ability to bounce back and stay strong after hard times."}, {"id": 5, "word": "contemplate", "phonetic": "/\u02c8k\u0252n.t\u0259m.ple\u026at/", "pos": "verb", "level": "B2", "definition": "To think deeply and deliberately about something over a long period.", "example": "He took a sabbatical to contemplate his long-term career aspirations and personal values.", "collocations": ["contemplate a decision", "contemplate the future", "hard to contemplate"], "b1Definition": "to think deeply and carefully about something for a long time."}, {"id": 6, "word": "cynical", "phonetic": "/\u02c8s\u026an.\u026a.k\u0259l/", "pos": "adjective", "level": "B2", "definition": "Distrustful of human sincerity or integrity; believing people are motivated by self-interest.", "example": "Having witnessed broken promises before, voters remained cynical about the candidate's pledge.", "collocations": ["cynical attitude", "deeply cynical", "cynical view"], "b1Definition": "believing that people only care about themselves, not good reasons."}, {"id": 7, "word": "ambivalent", "phonetic": "/\u00e6m\u02c8b\u026av.\u0259.l\u0259nt/", "pos": "adjective", "level": "C1", "definition": "Having simultaneous conflicting feelings or attitudes about something.", "example": "She felt profoundly ambivalent about relocating abroad for the promotion.", "collocations": ["feel ambivalent about", "ambivalent attitude", "somewhat ambivalent"], "b1Definition": "having two different feelings about something at the same time."}, {"id": 8, "word": "consensus", "phonetic": "/k\u0259n\u02c8sen.s\u0259s/", "pos": "noun", "level": "B2", "definition": "A general agreement arrived at by a group as a whole.", "example": "After exhaustive debate, the committee finally reached a consensus on the zoning regulations.", "collocations": ["reach a consensus", "broad consensus", "build a consensus"], "b1Definition": "an agreement that everyone in a group accepts."}, {"id": 9, "word": "sustainable", "phonetic": "/s\u0259\u02c8ste\u026a.n\u0259.b\u0259l/", "pos": "adjective", "level": "B2", "definition": "Able to be maintained at a certain rate without depleting natural resources.", "example": "Transitioning to sustainable agriculture is crucial for global food security.", "collocations": ["sustainable development", "sustainable future", "environmentally sustainable"], "b1Definition": "able to continue for a long time without causing harm or running out."}, {"id": 10, "word": "momentum", "phonetic": "/m\u0259\u02c8men.t\u0259m/", "pos": "noun", "level": "B2", "definition": "The driving force or strength gained through sustained forward progress.", "example": "The startup gathered considerable momentum after securing its initial venture funding.", "collocations": ["gain momentum", "lose momentum", "build momentum"], "b1Definition": "the growing force and speed that keeps a project moving forward."}, {"id": 11, "word": "implication", "phonetic": "/\u02cc\u026am.pl\u026a\u02c8ke\u026a.\u0283\u0259n/", "pos": "noun", "level": "B2", "definition": "A likely consequence or indirect conclusion that can be drawn.", "example": "The executive failed to grasp the legal implications of sharing confidential client data.", "collocations": ["far-reaching implications", "serious implications", "practical implications"], "b1Definition": "a possible result or hidden effect of an action or rule."}, {"id": 12, "word": "acknowledge", "phonetic": "/\u0259k\u02c8n\u0252l.\u026ad\u0292/", "pos": "verb", "level": "B2", "definition": "To accept or admit the reality, truth, or existence of a fact.", "example": "The director acknowledged that mistakes were made during the initial production phase.", "collocations": ["readily acknowledge", "fail to acknowledge", "openly acknowledge"], "b1Definition": "to admit that something is true, or to say thank you for something."}, {"id": 13, "word": "hypothesis", "phonetic": "/ha\u026a\u02c8p\u0252\u03b8.\u0259.s\u026as/", "pos": "noun", "level": "B2", "definition": "A proposed explanation based on limited evidence, subject to empirical testing.", "example": "The laboratory conducted repeated experiments to validate their initial working hypothesis.", "collocations": ["test a hypothesis", "formulate a hypothesis", "working hypothesis"], "b1Definition": "an educated guess or idea that scientists test with experiments."}, {"id": 14, "word": "contradict", "phonetic": "/\u02cck\u0252n.tr\u0259\u02c8d\u026akt/", "pos": "verb", "level": "B2", "definition": "To assert the opposite of, or to be logically inconsistent with.", "example": "The witness's new testimony directly contradicts her earlier statement to investigators.", "collocations": ["directly contradict", "evidence contradicts", "contradict yourself"], "b1Definition": "to say the opposite of what someone else said, or disagree with facts."}, {"id": 15, "word": "elaborate", "phonetic": "/i\u02c8l\u00e6b.\u0259.re\u026at/", "pos": "verb/adj", "level": "B2", "definition": "To explain or add detail; complicated, detailed, and intricate.", "example": "Could you elaborate on the proposed mitigation strategies outlined in section three?", "collocations": ["elaborate on a point", "elaborate plan", "further elaborate"], "b1Definition": "to give more details and explain something more fully."}, {"id": 16, "word": "anticipate", "phonetic": "/\u00e6n\u02c8t\u026as.\u026a.pe\u026at/", "pos": "verb", "level": "B2", "definition": "To foresee, expect, or prepare in advance for an eventuality.", "example": "A prudent manager anticipates potential bottlenecks before initiating a major project.", "collocations": ["anticipate problems", "eagerly anticipate", "fail to anticipate"], "b1Definition": "to expect something will happen and get ready for it."}, {"id": 17, "word": "undermine", "phonetic": "/\u02cc\u028cn.d\u0259\u02c8ma\u026an/", "pos": "verb", "level": "C1", "definition": "To weaken or diminish authority, credibility, or foundation gradually.", "example": "Spreading unverified rumors will undermine the team's trust and cohesion.", "collocations": ["undermine confidence", "undermine authority", "seriously undermine"], "b1Definition": "to make someone or something weaker step by step."}, {"id": 18, "word": "profound", "phonetic": "/pr\u0259\u02c8fa\u028and/", "pos": "adjective", "level": "C1", "definition": "Having immense depth, seriousness, or far-reaching significance.", "example": "The invention of printing had a profound effect on the dissemination of human knowledge.", "collocations": ["profound impact", "profound effect", "profound insight"], "b1Definition": "very deep, powerful, or having a big meaning."}, {"id": 19, "word": "superficial", "phonetic": "/\u02ccsu\u02d0.p\u0259\u02c8f\u026a\u0283.\u0259l/", "pos": "adjective", "level": "B2", "definition": "Existing only on the surface; lacking depth, substance, or thoroughness.", "example": "A superficial examination of the financial audit masked severe structural deficits.", "collocations": ["superficial knowledge", "superficial resemblance", "purely superficial"], "b1Definition": "only on the surface; not deep, thorough, or serious."}, {"id": 20, "word": "inevitable", "phonetic": "/\u026an\u02c8ev.\u026a.t\u0259.b\u0259l/", "pos": "adjective", "level": "B2", "definition": "Unavoidable; bound to occur regardless of preventive efforts.", "example": "With urban populations climbing steadily, infrastructure expansion is inevitable.", "collocations": ["inevitable outcome", "almost inevitable", "accept the inevitable"], "b1Definition": "certain to happen; you cannot stop it or avoid it."}, {"id": 21, "word": "ambiguous", "phonetic": "/\u00e6m\u02c8b\u026a\u0261.ju.\u0259s/", "pos": "adjective", "level": "B2", "definition": "Open to more than one interpretation; unclear or having double meaning.", "example": "The contractual terms were deliberately ambiguous to allow room for renegotiation.", "collocations": ["ambiguous wording", "highly ambiguous", "remain ambiguous"], "b1Definition": "not clear; having more than one possible meaning."}, {"id": 22, "word": "articulate", "phonetic": "/\u0251\u02d0\u02c8t\u026ak.j\u0259.l\u0     const STORIES_432 = [{"id": 1, "title": "The Unmarked Path", "level": "B2-C1", "wordCount": 224, "keywords": ["mountain fork", "stone cottages", "elderly Elena", "off-grid orchards", "celestial rhythm", "hum of highway"], "text": "High in the misty folds of the Rhodope Mountains, Julian took a fork in the trail that appeared on no official cartographic map. Dense pine canopies filtered the afternoon sunlight into emerald beams, and the distant roar of a cascading stream guided his boots downward. After an hour of descent, the forest unexpectedly parted to reveal an isolated settlement of stone cottages with slate roofs, their chimney smoke curling lazily into the crisp alpine air.\n\nAn elderly weaver named Elena greeted him from her wooden porch, neither startled nor suspicious. Instead of treating him as an intruder, she offered a steaming mug of herbal tea infused with mountain mint and honey. The villagers, he soon discovered, were third-generation custodians of ancient terraced orchards, living virtually untethered from the electrical grid and digital communications. Their clock was governed by seasonal harvests and celestial rhythms rather than digital calendars.\n\nJulian stayed until twilight, listening to folklore of subterranean rivers and forgotten silver mines. When he finally climbed back to the modern trailhead, the distant hum of highway traffic felt strangely foreign, like an echo from a world he had outgrown.", "formalPrompt": "Deliver this as an anthropological field briefing to academic peers.", "casualPrompt": "Tell this as a campfire travel story to a close friend over coffee."}, {"id": 2, "title": "The Accidental Catalyst", "level": "B2-C1", "wordCount": 218, "keywords": ["turbine blades", "spilled beaker", "iridescent gel", "tensile strength", "biodegradable", "serendipitous error"], "text": "Dr. Marcus Vance had spent six grueling months attempting to synthesize a heat-resistant coating for marine turbine blades. It was a bleak Tuesday midnight when exhaustion got the better of him. In his haste to clean the workstation, he accidentally knocked a beaker of concentrated citrus ester into a petri dish containing a sluggish polymer solution. Expecting a toxic vapor or scorched glass, he winced and stepped back behind the safety shield.\n\nInstead, a curious reaction unfolded before his eyes. Within ninety seconds, the murky liquid congealed into an iridescent, flexible gel that rapidly hardened at ambient room temperature. When Marcus subjected the unexpected residue to tensile stress and water immersion the following morning, the material exhibited astonishing tensile resilience while breaking down completely in saline water within forty-eight hours.\n\nWhat was intended as a synthetic marine resin had inadvertently yielded a revolutionary, fully biodegradable polymer capable of replacing petroleum packaging. Marcus stared at his laboratory notebook, marveling at the serendipity of human error. Sometimes scientific breakthroughs arrive not through meticulous calculation, but through the grace of an unscripted stumble.", "formalPrompt": "Present this as an executive summary of accidental innovation in materials science.", "casualPrompt": "Tell this as an exciting story about a clumsy mistake that ended up saving the planet."}, {"id": 3, "title": "The Rooftop Sanctuary", "level": "B2", "wordCount": 222, "keywords": ["locked out", "tar rooftop", "wildflower sprout", "wooden pallets", "verdant oasis", "reconnected neighbors"], "text": "For eight relentless years, Clara had inhabited a world of digital spreadsheets, fluorescent cubicles, and commuter trains where no one made eye contact. Her sense of time had flattened into quarterly forecasts and deliverables. One stifling August evening, locked out of her apartment while waiting for a locksmith, she pushed open the rusty emergency door leading to the building's unused flat tar roof.\n\nSpread across the neglected gravel were resilient wildflowers sprouting from cracked asphalt, a windblown dandelion clock, and panoramic vistas of the setting sun casting copper light across the city's glass spires. Right then and there, a quiet spark ignited. Over the next six months, Clara hauled bags of soil, salvaged wooden pallets, and planted heritage tomato vines, fragrant lavender, and pollinator-friendly wildflowers.\n\nThe rooftop transformed into a verdant oasis suspended twelve stories above the ceaseless honking of urban traffic. Neighbors who had lived on the same floor for years without speaking began gathering at dusk to prune basil and share stories over homemade herbal infusions. In reclaiming that forgotten concrete square, Clara had done more than cultivate a garden; she had revived her own dormant vitality and knitted together an alienated urban community.", "formalPrompt": "Frame this as a sociological case study on urban greening and social cohesion.", "casualPrompt": "Share this as an inspiring life-change story you heard about a neighbor in your building."}, {"id": 4, "title": "The Midnight Manuscript", "level": "B2-C1", "wordCount": 215, "keywords": ["burst pipe", "sub-vault crates", "cedar false bottom", "female chemist", "synthetic dyes", "silenced legacy"], "text": "As an assistant archivist at the city's central historical repository, Simon spent his days cataloging municipal land deeds and dusty legislative records. It was meticulous, solitary work that rarely stirred the pulse. That changed when a water pipe burst in the basement sub-vault, forcing staff to urgently evacuate crates of uncataloged donations dating back to the late nineteenth century.\n\nInside a damp, leather-wrapped deed box, Simon felt a false bottom made of cedar veneer. Prying it loose with a bone folder, he uncovered a handwritten manuscript tied with a weathered silk ribbon. The pages belonged to an anonymous female chemist who had worked under a male pseudonym during the industrial revolution. Her detailed sketches and chemical equations clearly preceded the recognized discovery of synthetic dye pigments by over two decades.\n\nHer personal diary entries chronicled both her breathtaking intellectual discoveries and the painful necessity of remaining invisible in a society that dismissed women of science. Simon sat in the quiet archival reading room until dawn, transfixed by her voice, determined that her silenced legacy would finally receive the scholarly tribute it so richly deserved.", "formalPrompt": "Present this as an archival keynote on historical justice and rediscovering forgotten scientists.", "casualPrompt": "Tell this like a historical mystery podcast segment about finding a hidden treasure."}, {"id": 5, "title": "The Bridge of Whispers", "level": "B2", "wordCount": 220, "keywords": ["decade of silence", "father's estate", "antique music box", "winding key note", "pottery studio", "dual harmony"], "text": "Ten years had passed since David and his younger sister Clara had spoken, separated by the bitter division of their father's contested estate. What began as petty legal squabbles had calcified into an unyielding wall of resentful silence. The thaw arrived unexpectedly when an old antique merchant in their hometown forwarded a package: their late father's brass mechanical music box, which neither had seen since early childhood.\n\nAccompanying the heirloom was a brief handwritten note their father had deposited with the shopkeeper before his passing. It read simply: 'Harmony requires two hands on the winding key.' David booked a train ticket that very afternoon, arriving unannounced at Clara's pottery studio on the edge of the river estuary.\n\nWhen she opened the door, her initial guarded expression dissolved as he set the music box onto the wooden table between them. Without a word, they each grasped one side of the dual winding mechanism, turning it in gentle unison. As the chime played a melody from their shared youth, the ten years of accumulated pride evaporated in a single breath, replaced by tears of profound relief and the promise of a reconciled future.", "formalPrompt": "Examine this as a narrative study on symbolic reconciliation and conflict resolution.", "casualPrompt": "Tell this as a heartfelt family story that illustrates the power of letting go of pride."}];

    // Helper to format date YYYY-MM-DD
    function getTodayDateString() {
      const d = new Date();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + month + "-" + day;
    }

    // Time-based friendly greeting
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good morning, " + APP_STATE.userName + "! 👋";
      if (hour < 18) return "Good afternoon, " + APP_STATE.userName + "! 👋";
      return "Good evening, " + APP_STATE.userName + "! 👋";
    }

    // HTML escape helper
    function escapeHtml(str) {
      if (!str) return "";
      const q2 = String.fromCharCode(34);
      const q1 = String.fromCharCode(39);
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .split(q2).join("&quot;")
        .split(q1).join("&#39;");
    }

    // Load state from localStorage
    function loadState() {
      try {
        const storedName = localStorage.getItem("eng_user_name");
        if (storedName) APP_STATE.userName = storedName;

        const storedStreak = localStorage.getItem("eng_streak");
        if (storedStreak) {
          const parsed = JSON.parse(storedStreak);
          if (parsed && typeof parsed.count === "number") {
            const today = getTodayDateString();
            if (parsed.lastDate) {
              const last = new Date(parsed.lastDate);
              const cur = new Date(today);
              const diffDays = Math.round((cur - last) / (1000 * 60 * 60 * 24));
              if (diffDays > 1) {
                parsed.count = 0;
              }
            }
            APP_STATE.streak = parsed;
          }
        }

        const storedSessions = localStorage.getItem("eng_sessions");

      initSRSDeck();

    function saveState() {

        localStorage.setItem("eng_streak", JSON.stringify(APP_STATE.streak));

    // Update streak when user finishes a session
    function updateStreakOnSession() {
      const today = getTodayDateString();
      const s = APP_STATE.streak;
      if (!s.lastDate) {
        s.count = 1;
        s.lastDate = today;
      } else if (s.lastDate === today) {
        // Practiced today already, maintain streak
      } else {
        const last = new Date(s.lastDate);
        const cur = new Date(today);
        const diffDays = Math.round((cur - last) / (1000 * 60 * 60 * 24));
        if (diffDays === 1) {
          s.count += 1;
        } else {
          s.count = 1;
        }
        s.lastDate = today;
      }
      saveState();

    // Web Audio Sound Generator
    function playChime(type) {
      try {
        if (!APP_STATE.settings.soundEnabled) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        if (type === "tick") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === "complete") {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach(function(freq, idx) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.18, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.35);
          });
        } else if (type === "flip") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(520, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    }

    // Confetti canvas explosion
    function fireConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ["#FFE500", "#39FF14", "#FFB3C6", "#C9B8FF", "#A8D8FF", "#111827"];
      const particles = [];
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: canvas.width * 0.5,
          y: canvas.height * 0.4,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 8 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10
        });
      }
      let frame = 0;
      function renderParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(function(p) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.45;
          p.rotation += p.rotationSpeed;
          if (p.y < canvas.height) {
            alive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });
        frame++;
        if (alive && frame < 90) {
          requestAnimationFrame(renderParticles);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      renderParticles();
    }

    // Timer Implementation with SVG ring
    function startTimer(seconds, onTick, onComplete) {
      stopTimer();

      APP_STATE.timer.intervalId = setInterval(function() {
        APP_STATE.timer.remainingSeconds--;
        if (APP_STATE.timer.remainingSeconds <= 5 && APP_STATE.timer.remainingSeconds > 0) {
          playChime("tick");
        }
        updateTimerUI();
        if (typeof onTick === "function") {
          onTick(APP_STATE.timer.remainingSeconds, APP_STATE.timer.totalSeconds);
        }
        if (APP_STATE.timer.remainingSeconds <= 0) {
          stopTimer();
          playChime("complete");
          if (typeof APP_STATE.timer.onComplete === "function") {
            APP_STATE.timer.onComplete();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      if (APP_STATE.timer.isRunning) {
        clearInterval(APP_STATE.timer.intervalId);
        APP_STATE.timer.intervalId = null;
        APP_STATE.timer.isRunning = false;
      } else if (APP_STATE.timer.remainingSeconds > 0) {
        APP_STATE.timer.isRunning = true;
        APP_STATE.timer.intervalId = setInterval(function() {
          APP_STATE.timer.remainingSeconds--;
          if (APP_STATE.timer.remainingSeconds <= 5 && APP_STATE.timer.remainingSeconds > 0) {
            playChime("tick");
          }
          updateTimerUI();
          if (APP_STATE.timer.remainingSeconds <= 0) {
            stopTimer();
            playChime("complete");
            if (typeof APP_STATE.timer.onComplete === "function") {

            }
          }
        }, 1000);
      }
      updateTimerButtonUI();
    }

    function stopTimer() {
      if (APP_STATE.timer.intervalId) {
        clearInterval(APP_STATE.timer.intervalId);
        APP_STATE.timer.intervalId = null;
      }
      APP_STATE.timer.isRunning = false;
      updateTimerButtonUI();

    function resetTimer(seconds) {
      stopTimer();
      const sec = typeof seconds === "number" ? seconds : APP_STATE.timer.totalSeconds;
      APP_STATE.timer.totalSeconds = sec;
      APP_STATE.timer.remainingSeconds = sec;
      updateTimerUI();

    function addTimerSeconds(extraSec) {
      APP_STATE.timer.remainingSeconds += extraSec;
      APP_STATE.timer.totalSeconds = Math.max(APP_STATE.timer.totalSeconds, APP_STATE.timer.remainingSeconds);
      updateTimerUI();
    }

    function updateTimerUI() {
      const ring = document.getElementById("timer-progress-ring");
      const text = document.getElementById("timer-display");
      if (!ring || !text) return;
      const total = APP_STATE.timer.totalSeconds || 1;
      const rem = Math.max(0, APP_STATE.timer.remainingSeconds);
      const radius = 54;
      const circumference = 2 * Math.PI * radius;
      const fraction = rem / total;
      const offset = circumference * (1 - fraction);
      ring.style.strokeDashoffset = offset;

      if (fraction > 0.45) {
        ring.setAttribute("stroke", "#39FF14");
      } else if (fraction > 0.2) {
        ring.setAttribute("stroke", "#FFE500");
      } else {
        ring.setAttribute("stroke", "#FF4B4B");
      }

      const mins = Math.floor(rem / 60);
      const secs = rem % 60;
      text.innerText = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      updateTimerButtonUI();
    }

      const btn = document.getElementById("timer-toggle-btn");

    function getDueCards() {
      const today = getTodayDateString();
      return SRS_SEED_CARDS.filter(function(card) {

        return !state || !state.nextDue || state.nextDue <= today;

    function rateSRSCard(quality) {
      const due = getDueCards();
      if (!due.length) return;
      const currentCard = due[APP_STATE.tech6.currentIndex % due.length];
      if (!currentCard) return;
      const s = APP_STATE.srsState[currentCard.id] || { interval: 1, repetition: 0, ef: 2.5, nextDue: "" };

      if (quality === 1) {
        s.repetition = 0;
        s.interval = 1;
        s.ef = Math.max(1.3, s.ef - 0.2);
      } else if (quality === 2) {
        s.repetition += 1;
        s.interval = Math.max(1, Math.round(s.interval * 1.2));
        s.ef = Math.max(1.3, s.ef - 0.15);
      } else if (quality === 3) {
        if (s.repetition === 0) s.interval = 1;
        else if (s.repetition === 1) s.interval = 6;
        else s.interval = Math.round(s.interval * s.ef);
        s.repetition += 1;
      } else if (quality === 4) {
        if (s.repetition === 0) s.interval = 2;
        else if (s.repetition === 1) s.interval = 8;
        else s.interval = Math.round(s.interval * s.ef * 1.3);
        s.repetition += 1;
        s.ef += 0.15;
      }

      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + s.interval);
      const month = String(nextDate.getMonth() + 1).padStart(2, "0");
      const day = String(nextDate.getDate()).padStart(2, "0");
      s.nextDue = nextDate.getFullYear() + "-" + month + "-" + day;

      APP_STATE.srsState[currentCard.id] = s;
      APP_STATE.tech6.reviewedToday += 1;
      APP_STATE.tech6.isFlipped = false;
      saveState();

      const remaining = getDueCards();
      if (remaining.length === 0) {
        logSession(6, "Flashcard Review", 300, "Reviewed " + APP_STATE.tech6.reviewedToday + " flashcards");
      } else {
        APP_STATE.tech6.currentIndex = APP_STATE.tech6.currentIndex % remaining.length;
        render();
      }
    }

    function flipCard() {
      APP_STATE.tech6.isFlipped = !APP_STATE.tech6.isFlipped;
      playChime("flip");
      const inner = document.getElementById("flashcard-inner");
      if (inner) {

          <div>
            <div class='text-xs font-bold text-gray-500 uppercase'>Example in a Sentence:</div>
            <div class='text-xs italic text-gray-800 bg-white p-2.5 rounded border border-gray-200 mt-0.5'>
              &ldquo;${escapeHtml(word.example)}&rdquo;
            </div>
          </div>
          <div>
            <div class='text-xs font-bold text-gray-500 uppercase mb-1'>Natural Collocations:</div>
            <div class='flex flex-wrap gap-1.5'>

          </div>
          <div class='pt-2 border-t border-gray-200 flex justify-end'>
            <button onclick='finishTech1()' class='neo-btn px-5 py-2 bg-[#39FF14] rounded-lg text-xs font-bold'>
              💾 Finish &amp; Save Session

      APP_STATE.tech1.wordIndex++;
      APP_STATE.tech1.isRevealed = false;
      resetTimer(60);
      render();
    }

    function toggleTech1Reveal() {

    function finishTech1() {

            <div class='flex flex-wrap gap-1.5'>
              ${keywordsHtml}

          </div>` : ""}

      APP_STATE.tech2.sceneIndex++;

      APP_STATE.tech2.showBoosters = false;
      resetTimer(60);
      render();

      APP_STATE.tech2.showBoosters = !APP_STATE.tech2.showBoosters;
      render();
    }

    function handleImageUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        APP_STATE.tech2.customImage = evt.target.result;
        render();
      };
      reader.readAsDataURL(file);
    }

    function clearCustomImage() {
      APP_STATE.tech2.customImage = null;
      render();
    }

    function finishTech2() {
      const scene = VISUAL_SCENES[APP_STATE.tech2.sceneIndex % VISUAL_SCENES.length];
      logSession(2, "Describe a Picture", 60, "Described scene: " + scene.title);
    }

    // TECHNIQUE 3: 3 Words, 1 Story
    function renderTech3() {
      const words = APP_STATE.tech3.words;
      const typed = APP_STATE.tech3.storyText;
      const wordCount = typed.trim() ? typed.trim().split(/\s+/).length : 0;

      function renderWordChip(w) {
        const isUsed = typed.toLowerCase().includes(w.word.toLowerCase());
        const bg = isUsed ? "bg-[#39FF14]" : "bg-white";
        const check = isUsed ? "✔" : "○";
        return `<div class='neo-card-sm p-3 ${bg} flex-1 text-center space-y-1'>
          <div class='text-sm sm:text-base font-black text-[#111827]'>${check} ${escapeHtml(w.word)}</div>
          <div class='text-[10px] text-gray-600 font-medium'>${escapeHtml(w.hint)}</div>
        </div>`;
      }

      const wordChipsHtml = words.map(renderWordChip).join("");

      return `<div class='space-y-4'>
        <div class='neo-card p-4 bg-[#FFB3C6] space-y-1'>

      const wordNames = APP_STATE.tech3.words.map(function(w) { return w.word; }).join(", ");

            <input type='text' value='${escapeHtml(answers[1])}' oninput='handleTech4Input(1, this.value)' placeholder='Sentence 2...' class='w-full p-2.5 border-2 border-[#111827] rounded-lg text-xs'>

      const sessionCountMap = {};
      APP_STATE.sessions.forEach(function(s) {
        if (s.date) {
          sessionCountMap[s.date] = (sessionCountMap[s.date] || 0) + 1;
        }
      });

      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        const dStr = d.getFullYear() + "-" + month + "-" + day;
        days.push({ date: dStr, dayNum: d.getDate(), count: sessionCountMap[dStr] || 0 });

        let bg = "bg-gray-100 border-gray-300";

        return `<div class='h-8 rounded border flex items-center justify-center text-[10px] font-bold ${bg}' title='${item.date}: ${item.count} session(s)'>

            </div>
            <button onclick='toggleSound()' class='neo-btn px-4 py-1.5 bg-white rounded-lg text-xs font-bold'>
              ${APP_STATE.settings.soundEnabled ? "🔊 Enabled" : "🔇 Muted"}
            </button>
          </div>
        </div>

        <div class='neo-card p-5 bg-white space-y-4'>
          <h3 class='text-sm font-black text-[#111827] uppercase border-b pb-2'>Backup &amp; Restore Data</h3>
          <p class='text-xs text-gray-600'>Save your sessions and streak to a JSON file, or restore them anytime.</p>
          <div class='flex flex-wrap gap-2'>
            <button onclick='exportDataJSON()' class='neo-btn px-4 py-2 bg-[#A8D8FF] rounded-lg text-xs font-bold'>
              📥 Download Backup (JSON)
            </button>
            <label class='neo-btn px-4 py-2 bg-white rounded-lg text-xs font-bold cursor-pointer'>
              📤 Restore from Backup
              <input type='file' accept='.json' onchange='importDataJSON(event)' class='hidden'>
            </label>
          </div>
        </div>

        <div class='neo-card p-5 bg-red-50 border-red-900 space-y-3'>
          <h3 class='text-sm font-black text-red-900 uppercase'>Danger Zone</h3>
          <p class='text-xs text-red-800'>Reset all streak, practice sessions, and flashcard memories back to zero.</p>
          <button onclick='confirmResetData()' class='neo-btn px-4 py-2 bg-red-200 text-red-900 border-red-900 rounded-lg text-xs font-bold'>
            ⚠️ Reset All Progress
          </button>
        </div>
      </div>`;
    }

    function saveProfileName() {
      const input = document.getElementById("profile-name-input");
      if (input && input.value.trim()) {
        APP_STATE.userName = input.value.trim();
        saveState();
        render();
      }
    }

    function setTargetMinutes(m) {
      APP_STATE.settings.targetMinutes = m;
      saveState();
      render();
    }

    function toggleSound() {
      APP_STATE.settings.soundEnabled = !APP_STATE.settings.soundEnabled;
      saveState();
      render();
    }

    function exportDataJSON() {
      const backup = {
        version: "2.0",
        exportDate: new Date().toISOString(),
        userName: APP_STATE.userName,
        streak: APP_STATE.streak,
        sessions: APP_STATE.sessions,
        srsState: APP_STATE.srsState,
        settings: APP_STATE.settings
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "fluency-forge-backup-" + getTodayDateString() + ".json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importDataJSON(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.userName) APP_STATE.userName = parsed.userName;
          if (parsed.streak) APP_STATE.streak = parsed.streak;
          if (Array.isArray(parsed.sessions)) APP_STATE.sessions = parsed.sessions;
          if (parsed.srsState) APP_STATE.srsState = parsed.srsState;
          if (parsed.settings) APP_STATE.settings = parsed.settings;
          saveState();
          alert("Backup successfully restored!");
          render();
        }} catch (err) {
          alert("Invalid backup file: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    function confirmResetData() {
      if (confirm("Are you sure you want to reset all streak and practice data? This cannot be undone.")) {
        APP_STATE.streak = { count: 0, lastDate: "" };
        APP_STATE.sessions = [];
        APP_STATE.srsState = {};
        initSRSDeck();
        saveState();
        alert("All data has been reset.");
        render();
      }
    }

    // Completion Celebration Modal
    function showCompletionModal(techName, durationSec) {
      const modal = document.getElementById("modal-root");
      if (!modal) return;
      const mins = Math.max(1, Math.round(durationSec / 60));
      modal.innerHTML = `<div class='fixed inset-0 z-50 bg-black bg-opacity-40 flex items-center justify-center p-4'>
        <div class='neo-card max-w-sm w-full bg-white p-6 text-center space-y-4'>
          <div class='text-5xl'>🎉</div>
          <div>
            <span class='badge-chip bg-[#FFE500] text-[#111827]'>SESSION COMPLETED!</span>
            <h3 class='text-2xl font-black text-[#111827] mt-1'>${escapeHtml(techName)}</h3>
            <p class='text-xs text-gray-600 mt-1 font-medium'>
              Great practice! You built your fluency by ${mins} minute(s). Your streak is now ${APP_STATE.streak.count} day(s) 🔥.
            </p>
          </div>
          <div class='flex items-center justify-center gap-2 pt-2'>
            <button onclick='closeModalAndGoHome()' class='neo-btn w-full py-2.5 bg-[#39FF14] rounded-lg text-sm font-black'>
              Awesome! Return to Home →
            </button>
          </div>
        </div>
      </div>`;
    }

    function closeModalAndGoHome() {
      const modal = document.getElementById("modal-root");
      if (modal) modal.innerHTML = "";
      navigate("home");
    }

    // Spacebar listener for flashcard flipping
    window.addEventListener("keydown", function(e) {
      if (e.code === "Space" && APP_STATE.activeTechniqueId === 6 && !APP_STATE.paperMode) {
        const target = e.target;
        if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) return;
        e.preventDefault();
        flipCard();
      }
    });

    // Initialize application on load
    window.addEventListener("DOMContentLoaded", function() {
      loadState();
      render();
    });
  </script>
</body>
</html>
